function persona(){return '<label class="persona"><span class="muted">演示身份</span><select id="persona" aria-label="演示身份">'+state.people.map(p=>'<option value="'+p.id+'" '+(p.id===ui.person?'selected':'')+'>'+p.name+' · '+(p.role==='steward'?'管理志愿者':'住户')+'</option>').join('')+'</select></label>'}
function nav(items,active){return items.map(x=>'<button data-nav="'+x[0]+'" class="'+(x[0]===active?'active':'')+'">'+x[1]+'</button>').join('')}
function impact(id){const rs=reservations(id);return asset(id).state==='maintenance'?'<div class="notice" data-impact="'+id+'"><strong>维修中，暂时不能预约或借出</strong><br>'+(rs.length?rs.map(r=>esc(person(r.resident_id).name)+' · '+range(r)+' · '+r.id+' 预约保留').join('<br>')+'<br>检修完成后恢复办理。':'目前没有待履行预约。')+'</div>':''}
function log(id){const entries=state.events.filter(e=>!id||e.asset_id===id).slice().reverse();if(!id||id==='T02')entries.push({time:'09:00',text:'小禾借用缝纫机 · L01 · 09:00–11:00'});if(!id||id==='T03')entries.push({time:'已有',text:'投影仪画面偏色，等待检修 · M01'});return entries.length?entries.map(e=>'<div class="history-row"><time>'+e.time+'</time><span>'+esc(e.text)+'</span></div>').join(''):'<p class="empty">尚无交接记录。</p>'}
function records(id){return state.reservations.filter(r=>r.asset_id===id).map(r=>'<div class="record" data-reservation="'+r.id+'"><div><strong class="small">'+range(r)+' · '+esc(person(r.resident_id).name)+'</strong><p class="tiny muted">预约 '+r.id+'</p></div>'+tag(affected(r)?'affected':r.state)+'</div>').join('')||'<p class="empty">还没有预约。</p>'}
function ownCard(r){const a=asset(r.asset_id);return '<article class="paper reservation-card" data-reservation="'+r.id+'"><div class="row between"><span class="tiny muted">'+r.id+' · 10 月 13 日</span>'+tag(affected(r)?'affected':r.state)+'</div><h3>'+esc(a.name)+'</h3><div class="time">'+range(r)+'</div><p class="small muted">'+esc(a.area)+' · '+esc(person(r.resident_id).name)+'</p>'+(affected(r)?'<div class="notice">设备正在维修，你的预约 '+r.id+' 仍保留，暂时不能领取。下一步等待志愿者确认检修完成。</div>':'')+'<div class="row" style="margin-top:20px">'+openAsset(a.id,'查看设备与交接')+(r.state==='confirmed'?btn('取消预约','data-cancel="'+r.id+'"','small light'):'')+'</div></article>'}
function controls(id){const a=asset(id),l=loans(id)[0],m=repair(id),rs=reservations(id);if(!steward())return '<div class="stack">'+btn('预约一个时段','data-book="'+id+'" '+(a.state==='maintenance'?'disabled':''))+'<p class="small muted">'+(a.state==='maintenance'?'检修完成后开放预约。':'预约后由管理志愿者确认实际借出。')+'</p>'+rs.filter(r=>r.resident_id===ui.person).map(r=>'<div style="border-top:1px solid var(--line);padding-top:18px"><p class="small" style="margin-bottom:12px">'+r.id+' · '+range(r)+'</p>'+btn('取消这条预约','data-cancel="'+r.id+'"','small light')+'</div>').join('')+'</div>';let html=l?'<div class="stack"><div><p class="label">待接收归还 · '+l.id+'</p><strong>'+esc(person(l.resident_id).name)+'</strong><p class="small muted">'+range(l)+'</p></div>'+btn('接收归还','data-return="'+l.id+'"')+'</div>':'';if(m)html+='<div class="stack" style="margin-top:23px"><div><p class="label">待检修 · '+m.id+'</p><p class="small">'+esc(m.issue)+'</p></div>'+btn('确认检修完成','data-repair="'+m.id+'"')+'</div>';if(rs.length)html+='<div class="stack" style="margin-top:25px"><p class="label">待办理预约</p>'+rs.map(r=>'<div><p class="small" style="margin-bottom:12px">'+esc(person(r.resident_id).name)+' · '+range(r)+' · '+r.id+'</p>'+btn(a.state==='maintenance'?'查看借出拦截':'确认借出','data-checkout="'+r.id+'"','small '+(a.state==='maintenance'?'light':''))+'</div>').join('')+'</div>';return html||'<p class="small muted">当前没有待办理的交接。</p>'}
function assetRoute(){const links=steward()?[['home','全部设备'],['repairs','维修履历']]:[['home','全部设备'],['mine','我的预约']];const header='<header class="a-header"><div class="brand"><span class="mark">工</span>邻里器物</div><nav class="a-nav">'+nav(links,ui.view==='detail'?'home':ui.view)+'</nav>'+persona()+'</header>';let html='';
if(ui.view==='detail'){const a=asset(ui.asset),busy=loans(a.id).concat(reservations(a.id));html='<button class="link" data-nav="home">← 回到全部设备</button><div class="a-detail"><section class="stack"><div class="a-object-heading">'+art(a.id)+'<div><p class="eyebrow">'+a.id+' / '+esc(a.area)+'</p><h1>'+esc(a.name)+'</h1>'+tag(a.state)+'</div></div>'+impact(a.id)+'<section class="paper"><h3>这件器物的预约时段</h3><p class="small muted" style="margin-top:10px">10 月 13 日 · 时间衔接可以，重叠不可以</p><div class="schedule">'+busy.map(r=>'<span>'+range(r)+'<br>'+esc(person(r.resident_id).name)+'</span>').join('')+'<span class="free">'+(a.state==='maintenance'?'暂停预约':'相邻时段可预约')+'</span></div>'+records(a.id)+'</section><section class="paper"><h3>借用与维修履历</h3><div data-history="'+a.id+'">'+log(a.id)+'</div></section></section><aside class="stack"><section class="paper"><h3 style="margin-bottom:20px">'+(steward()?'在这件器物上办理':'安排我的使用时间')+'</h3>'+controls(a.id)+'</section><section class="paper"><p class="eyebrow muted">器物档案</p><div class="kv" style="margin-top:22px"><div><p class="label">设备编号</p><strong>'+a.id+'</strong></div><div><p class="label">所在区域</p><strong>'+esc(a.area)+'</strong></div></div><p class="small muted" style="margin-top:22px">预约、实际借出、归还和维修围绕同一件器物保留。</p></section></aside></div>'}

else if(ui.view==='repairs'){html='<div class="a-intro"><div><p class="eyebrow">CARE FOR THINGS</p><h1>维修也是器物的一部分</h1><p class="small muted">从设备进入，查看问题与受影响预约，再恢复使用。</p></div></div><div class="a-grid">'+state.repairs.map(m=>'<article class="paper"><div class="row between">'+tag(m.state)+'<span class="tiny muted">'+m.id+'</span></div><h2 style="margin:22px 0 13px">'+esc(asset(m.asset_id).name)+'</h2><p class="small">'+esc(m.issue)+'</p><div style="margin-top:25px">'+openAsset(m.asset_id,'打开设备履历 →')+'</div></article>').join('')+'</div>'}
else html='<div class="a-intro"><div><p class="eyebrow">NEIGHBOURHOOD WORKSHOP</p><h1>好用的东西，<br>一起好好用。</h1><p class="small muted">先挑一件工具，看它什么时候空着。借用与维修都在器物自己的档案里。</p></div><aside class="a-note"><span class="tiny muted">10 月 13 日 · 星期二</span><strong>3 件器物 / 3 个区域</strong><p class="small muted">今天缝纫机将在 11:00 交接。</p></aside></div><div class="searchbar"><input id="asset-search" placeholder="找一件工具…" aria-label="搜索设备"><p class="small muted">按设备找 · 借用状态一眼可见</p></div><div class="a-grid">'+state.assets.map(a=>'<article class="a-card" data-asset-card="'+a.id+'" data-search="'+esc(a.name+a.area)+'"><div class="object"><span class="inventory">'+a.id+' · 工坊藏品</span>'+art(a.id)+'</div><div class="content"><div class="row between"><span class="tiny muted">'+esc(a.area)+'</span>'+tag(a.state)+'</div><h2>'+esc(a.name)+'</h2><p class="small muted">'+(a.id==='T01'?'10:00–12:00 阿澄已预约':a.id==='T02'?'11:00 小禾归还 → 阿澄接用':'画面偏色，等待检修')+'</p>'+btn('查看时段与档案 <span>↗</span>','data-open-asset="'+a.id+'"','light')+'</div></article>').join('')+'</div><div class="a-bottom"><section class="paper"><p class="eyebrow muted">借还的约定</p><h3 style="margin:16px 0 10px">预约和拿到工具，是两件事。</h3><p class="small muted">住户安排自己的预约，志愿者在现场确认借出和接收归还。损坏后先检修，原预约始终保留。</p></section><section class="paper"><p class="eyebrow muted" style="margin-bottom:12px">最近交接</p>'+log()+'</section></div>';
return header+'<main class="a-main">'+html+'</main>'}
function journeyItem(r,type){const a=asset(r.asset_id);return '<div class="j-step"><time class="at">'+tm(r.start)+'</time><article class="ticket" data-'+(type==='loan'?'loan':'reservation')+'="'+r.id+'"><div class="row between"><span class="tiny muted">'+(steward()?esc(person(r.resident_id).name)+' · ':'')+r.id+'</span>'+tag(type==='reservation'&&affected(r)?'affected':r.state)+'</div><h3>'+esc(a.name)+'</h3><p class="small muted">'+range(r)+' · '+esc(a.area)+'<br>'+(type==='loan'?'使用结束后交给志愿者接收。':'预约保留，实际领取由志愿者确认。')+'</p>'+btn(steward()?'打开这次交接 →':'查看我的这一步 →','data-open-case="'+type+':'+r.id+'"','small light')+(affected(r)?'<div class="notice"><strong>这一程需要等待</strong><br>设备正在维修，原预约保留。检修完成后才能领取。</div>':'')+'</article></div>'}
function caseData(){const list=ui.caseType==='loan'?state.loans:ui.caseType==='reservation'?state.reservations:state.repairs;const item=list.find(x=>x.id===ui.caseId);return {item,a:asset(item.asset_id),p:item.resident_id?person(item.resident_id):null,type:ui.caseType}}
function caseActions(c){const r=c.item;if(!steward())return '<div class="stack"><p class="small muted">现场交接由管理志愿者办理，你可以查看状态或管理自己的预约。</p>'+(c.type==='reservation'&&r.state==='confirmed'?btn('取消我的预约','data-cancel="'+r.id+'"','light'):'')+openAsset(c.a.id,'查看工具与可用时间')+'</div>';let html=c.type==='loan'?(r.state==='active'?btn('接收这次归还','data-return="'+r.id+'"'):btn('已接收，不能重复归还','disabled','light')):c.type==='repair'?(r.state==='open'?btn('确认检修完成','data-repair="'+r.id+'"'):btn('这次检修已完成','disabled','light')):(r.state==='confirmed'?btn(c.a.state==='maintenance'?'查看借出拦截':'确认借出','data-checkout="'+r.id+'"'):btn('这条预约已办理','disabled','light'));const m=repair(c.a.id),next=reservations(c.a.id)[0];if(m&&c.type!=='repair')html+='<p class="small muted">'+esc(m.issue)+' · '+m.id+'</p>'+btn('接着处理检修','data-open-case="repair:'+m.id+'"','light');if(c.type==='repair'&&r.state==='done'&&next)html+='<p class="small muted">下一位：'+esc(person(next.resident_id).name)+' · '+range(next)+'</p>'+btn('办理下一次借出','data-open-case="reservation:'+next.id+'"','light');if(c.type==='reservation'&&r.state==='fulfilled'){const l=state.loans.find(x=>x.reservation_id===r.id);if(l)html+=btn('查看实际借用与归还','data-open-case="loan:'+l.id+'"','light')}return '<div class="stack">'+html+'</div>'}
function dayHeading(title,desc,sub){return '<div class="j-masthead"><div class="date"><span class="tiny">OCTOBER</span><span class="big">13</span><span class="tiny">星期二 · 10:00</span></div><div><p class="eyebrow muted">'+sub+'</p><h1>'+title+'</h1><p class="small muted">'+desc+'</p></div></div>'}
function journeyCase(){const c=caseData(),r=c.item,next=reservations(c.a.id).filter(x=>x.id!==r.id)[0];return '<button class="link" data-nav="home">← 回到'+(steward()?'交接簿':'我的今天')+'</button><div class="j-layout" style="margin-top:25px"><section class="j-focus"><div class="row between"><p class="eyebrow muted">'+(c.p?esc(c.p.name)+'的工坊日':'检修中的一程')+'</p>'+tag(c.type==='reservation'&&affected(r)?'affected':r.state)+'</div><h1>'+esc(c.a.name)+'</h1><p class="small muted">'+r.id+' · '+esc(c.a.area)+(r.start?' · '+range(r):'')+'</p>'+impact(c.a.id)+'<div class="process"><span class="number">1</span><div><h3>'+(c.type==='loan'?'接收使用结束的工具':c.type==='repair'?'把问题处理完':'确认现场领取')+'</h3><p class="small muted">'+(c.type==='repair'?esc(r.issue):c.type==='loan'?'确认归还时的状况，一次借用只接收一次。':'现场实际借出后产生借用记录，不把预约当作已经拿走工具。')+'</p><div class="actions">'+caseActions(c)+'</div></div></div><div class="process"><span class="number">2</span><div><h3>看下一位的安排</h3><p class="small muted">'+(next?esc(person(next.resident_id).name)+' · '+next.id+' · '+range(next):c.type==='reservation'?'这条预约属于 '+esc(c.p.name)+'。':'目前没有待衔接的预约。')+'</p><p class="small muted">维修期间保留预约，检修完成后才能再次借出。</p></div></div></section><aside class="stack"><section class="j-help"><p class="eyebrow">这一程的工具</p><div style="margin-top:16px">'+art(c.a.id)+'</div><h2>'+esc(c.a.name)+'</h2>'+tag(c.a.state)+'<div style="margin-top:23px">'+openAsset(c.a.id,'查看所有时段')+'</div></section><section class="paper"><h3>交接留下的记录</h3>'+log(c.a.id)+'</section></aside></div>'}
function journeyRoute(){const links=steward()?[['home','交接簿'],['repairs','检修进度'],['browse','工具']]:[['home','我的今天'],['browse','找工具']];const header='<header class="j-header"><div class="brand"><span class="mark">日</span>工坊日</div><nav class="j-nav">'+nav(links,ui.view)+'</nav>'+persona()+'</header>';let html='';

else {const rs=state.reservations.filter(r=>steward()||r.resident_id===ui.person),ls=state.loans.filter(l=>steward()||l.resident_id===ui.person),all=ls.map(r=>({r,type:'loan'})).concat(rs.map(r=>({r,type:'reservation'}))).sort((a,b)=>a.r.start.localeCompare(b.r.start));html=dayHeading(steward()?'一个交接，连着下一程。':esc(me().name)+'的工坊日',steward()?'按人的使用顺序接收、检修、再交出。每一步都能看到下一位受影响的人。':'从今天的安排出发，看清先去哪儿、什么时候领取，以及有没有需要等待的变化。',steward()?'HANDOFF JOURNAL':'YOUR WORKSHOP DAY')+'<div class="j-layout"><section><h2 class="j-title">'+(steward()?'今天的交接 · 按使用时间':'我的安排 · 10 月 13 日')+'</h2>'+all.map(x=>journeyItem(x.r,x.type)).join('')+(all.length?'':'<p class="empty">今天还没有安排。去找一件工具吧。</p>')+'</section><aside class="stack"><section class="j-help"><p class="eyebrow">下一程</p><div class="arrow">→</div><h2>'+(steward()?'小禾 → 阿澄':'让每次来访心里有数')+'</h2><p>'+(steward()?'缝纫机 09:00–11:00 小禾使用，11:00–12:00 阿澄已预约。接收归还时若发现损坏，后面这一程需要等检修完成。':'我的预约、当前借用和设备变化集中在同一天。还没有预约时，从“找工具”开始。')+'</p>'+btn(steward()?'进入小禾的交接':'找一件工具',steward()?'data-open-case="loan:L01"':'data-nav="browse"','small light')+'</section><section class="paper"><p class="eyebrow muted">现场角色</p><p class="small muted" style="margin-top:16px">住户管理自己的预约。<br>志愿者接收归还、确认借出和完成检修。</p></section></aside></div>'}

function deskHeading(title,desc){return '<div class="d-heading"><div><h1>'+title+'</h1><p class="small muted">'+desc+'</p></div><span class="d-clock">13 OCT / 10:00</span></div>'}
function deskRoute(){const links=steward()?[['home','01　今天的交接'],['repairs','02　维修队列'],['browse','03　设备台账']]:[['home','01　我的事项'],['browse','02　设备台账']];const side='<aside class="d-sidebar"><div class="brand"><span class="mark">工</span>工坊值班台</div><div><p class="eyebrow">'+(steward()?'值班工作区':'住户工作区')+'</p><nav class="d-nav">'+nav(links,ui.view==='case'?'home':ui.view)+'</nav></div><div class="foot">固定演示日<br>2026.10.13 / 10:00<br><br>先处理现场交接，<br>再看下一位能否领取。</div></aside>';let html='';
if(ui.view==='case'){const c=caseData(),r=c.item;html='<button class="link" data-nav="home">← 返回事项队列</button><div class="d-case"><section class="file"><div class="row between"><p class="eyebrow muted">交接案卷 / '+r.id+'</p>'+tag(c.type==='reservation'&&affected(r)?'affected':r.state)+'</div><h1>'+esc(c.a.name)+'</h1><p class="small muted">'+esc(c.a.area)+' · '+c.a.id+'</p><div class="kv" style="margin:28px 0"><div><p class="label">'+(c.p?'关联住户':'检修问题')+'</p><strong>'+esc(c.p?c.p.name:r.issue)+'</strong></div><div><p class="label">'+(r.start?'使用时间':'维修状态')+'</p><strong>'+(r.start?range(r):names[r.state])+'</strong></div></div>'+impact(c.a.id)+'<div class="paper"><h3>同设备的预约</h3>'+records(c.a.id)+'</div><h3 style="margin-top:25px">交接与维修留档</h3>'+log(c.a.id)+'</section><aside class="operations"><p class="eyebrow muted">现场办理</p><h3 style="margin-top:15px">'+(c.type==='loan'?'接收归还':c.type==='repair'?'完成检修':'确认实际借出')+'</h3>'+caseActions(c)+'</aside></div>'}
else if(ui.view==='detail'){const a=asset(ui.asset);html='<button class="link" data-nav="browse">← 返回设备台账</button><div class="d-case"><section class="file"><div class="row between"><p class="eyebrow muted">设备台账 / '+a.id+'</p>'+tag(a.state)+'</div><h1>'+esc(a.name)+'</h1><p class="small muted">'+esc(a.area)+'</p>'+impact(a.id)+'<h3 style="margin-top:24px">预约列表</h3>'+records(a.id)+'<h3 style="margin-top:26px">现场记录</h3>'+log(a.id)+'</section><aside class="operations"><h3>'+(steward()?'办理操作':'安排使用')+'</h3>'+controls(a.id)+'</aside></div>'}
else if(ui.view==='browse')html=deskHeading('设备台账','从台账查询工具，现场处理集中在事项队列。')+'<table class="d-table"><thead><tr><th>设备</th><th class="area-col">区域</th><th>状态</th><th>操作</th></tr></thead><tbody>'+state.assets.map(a=>'<tr><td><div class="row">'+art(a.id)+'<span>'+esc(a.name)+'<br><span class="tiny muted">'+a.id+'</span></span></div></td><td class="area-col">'+esc(a.area)+'</td><td>'+tag(a.state)+'</td><td>'+openAsset(a.id,'打开')+'</td></tr>').join('')+'</tbody></table>';
else if(ui.view==='repairs')html=deskHeading('维修队列','受影响预约连在同一案卷上，完成检修后恢复设备使用。')+'<div class="d-board">'+lane('待检修',state.repairs.filter(m=>m.state==='open'),'repair')+lane('已完成 · 留档',state.repairs.filter(m=>m.state==='done'),'repair')+'</div>';
else {const ls=state.loans.filter(l=>l.state==='active'&&(steward()||l.resident_id===ui.person)),rs=state.reservations.filter(r=>r.state==='confirmed'&&(steward()||r.resident_id===ui.person)),ms=state.repairs.filter(m=>m.state==='open'),done=state.loans.filter(l=>l.state==='returned'&&(steward()||l.resident_id===ui.person));html=deskHeading(steward()?'今天的交接':'我的事项',steward()?'按需要办理的动作组织工作。选一件待办，打开完整案卷。':'只显示自己的预约和借用。工具变化直接贴在受影响事项上。')+'<div class="d-board">'+lane(steward()?'待归还':'我的借用',ls,'loan')+lane(steward()?'待借出':'我的预约',rs,'reservation')+lane(steward()?'维修':'已完成',steward()?ms:done,steward()?'repair':'loan')+'</div><section class="d-log"><div class="row between"><h3>最近交接留档</h3><span class="tiny muted">设备 · 住户 · 时间可对应</span></div>'+log()+'</section>'}
return '<div class="d-shell">'+side+'<div><header class="d-top"><h2>'+esc(me().name)+' · '+(steward()?'管理志愿者':'住户')+'</h2>'+persona()+'</header><main class="d-main">'+html+'</main></div></div>'}
let toastTimer;function message(text,error){const t=$('#toast');t.hidden=false;t.className='toast'+(error?' error':'');t.textContent=text;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,10000)}
function render(){document.body.className=ui.route;$('#app').innerHTML=ui.route==='assets'?assetRoute():ui.route==='journey'?journeyRoute():deskRoute();document.querySelectorAll('[data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===ui.route));try{const u=new URL(location.href);u.searchParams.set('route',ui.route);u.searchParams.set('persona',ui.person);u.searchParams.set('view',ui.view);if(ui.view==='detail')u.searchParams.set('asset',ui.asset);else u.searchParams.delete('asset');window.history.replaceState(null,'',u.href)}catch(_){}}
function event(id,text){state.events.push({asset_id:id,time:'10:00',text})}
function fail(text){message(text,true);return {ok:false,text}}
function act(a){
if(['checkout','return','repair'].includes(a.type)&&!steward())return fail('只有管理志愿者可以办理现场交接和检修。');
if(a.type==='book'){if(steward())return fail('住户管理自己的预约，请切换到住户身份。');const x=asset(a.assetId);if(x.state==='maintenance')return fail('设备正在维修，不能新增预约。');const start='2026-10-13T'+a.start+':00',end='2026-10-13T'+a.end+':00';if(!/^\d{2}:\d{2}$/.test(a.start)||!/^\d{2}:\d{2}$/.test(a.end)||start>=end)return fail('请填写有效时段，结束时间必须晚于开始时间。');if(reservations(x.id).concat(loans(x.id)).some(r=>overlap({start,end},r)))return fail('这个时段与现有预约或借用重叠。请换一个时段；结束与下一段开始相同可以衔接。');const id='B'+String(state.reservations.length+1).padStart(2,'0');state.reservations.push({id,asset_id:x.id,resident_id:ui.person,start,end,state:'confirmed'});event(x.id,me().name+' 预约 '+x.name+' · '+id+' · '+tm(start)+'–'+tm(end));return {ok:true,text:'预约已确认：'+x.name+' '+tm(start)+'–'+tm(end)+' · '+id+'。现场借出由志愿者办理。'};}
if(a.type==='cancel'){const r=state.reservations.find(x=>x.id===a.id);if(!r||r.resident_id!==ui.person||steward())return fail('只能取消你自己的预约。');if(r.state!=='confirmed')return fail('这条预约已经办理，不能取消。');r.state='cancelled';event(r.asset_id,me().name+' 取消预约 '+r.id+' · 原记录保留');return {ok:true,text:'预约 '+r.id+' 已取消，原记录保留。'};}
if(a.type==='checkout'){const r=state.reservations.find(x=>x.id===a.id);if(!r||r.state!=='confirmed')return fail('这条预约已经办理，不能重复借出。');const x=asset(r.asset_id);if(x.state==='maintenance')return fail('借出已停止：'+x.name+'正在维修。'+r.id+' 原预约仍保留，需先完成检修。');if(loans(x.id).length)return fail('借出已停止：'+x.name+'仍在借用中。请先接收归还，预约没有改变。');r.state='fulfilled';x.state='borrowed';const id='L'+String(state.loans.length+1).padStart(2,'0');state.loans.push({id,asset_id:x.id,resident_id:r.resident_id,start:r.start,end:r.end,state:'active',reservation_id:r.id,checked_out_at:state.demo_time});event(x.id,person(r.resident_id).name+' 实际借出 '+x.name+' · '+r.id+' → '+id+' · '+range(r));return {ok:true,text:'已向'+person(r.resident_id).name+'借出'+x.name+'。产生实际借用 '+id+'，预约 '+r.id+' 留档。'};}
if(a.type==='return'){const l=state.loans.find(x=>x.id===a.id);if(!l||l.state!=='active')return fail('这次借用已经归还，不能重复接收。');if(a.damaged&&!a.issue.trim())return fail('请写下发现的问题，方便后续检修。');const x=asset(l.asset_id);l.state='returned';l.returned_at=state.demo_time;l.return_condition=a.damaged?'damaged':'normal';x.state=a.damaged?'maintenance':'available';event(x.id,person(l.resident_id).name+' 归还 '+x.name+' · '+l.id+' · '+range(l)+' · '+(a.damaged?'发现损坏':'状况正常'));if(a.damaged){const id='M'+String(state.repairs.length+1).padStart(2,'0');state.repairs.push({id,asset_id:x.id,issue:a.issue.trim(),state:'open',loan_id:l.id});event(x.id,x.name+' 转入维修 '+id+' · '+a.issue.trim());const ids=reservations(x.id).map(r=>r.id).join('、');return {ok:true,text:'归还已接收，'+x.name+'转入维修。'+(ids?ids+' 原预约保留并提示受影响':'目前没有待履行预约')+'，借出暂停。'};}return {ok:true,text:'归还已接收，'+x.name+'恢复可使用。'+l.id+' 已归还，不能重复接收。'};}
if(a.type==='repair'){const m=state.repairs.find(x=>x.id===a.id);if(!m||m.state!=='open')return fail('这次检修已经完成，记录不会重复办理。');m.state='done';m.completed_at=state.demo_time;asset(m.asset_id).state='available';event(m.asset_id,'志愿者确认 '+asset(m.asset_id).name+' 检修完成 · '+m.id+' · 原维修记录保留');return {ok:true,text:'检修完成，'+asset(m.asset_id).name+'恢复可使用。受影响预约保留，可继续办理借出。'};}return fail('操作不存在。');
}
function run(a){const r=act(a);if(r.ok){render();message(r.text)}return r}
function closeModal(){ui.modal=null;$('#modal-host').innerHTML=''}
function modal(kind,id){ui.modal={kind,id};let html='';
if(kind==='book'){const a=asset(id);html='<h2 id="modal-title">预约'+esc(a.name)+'</h2><p class="subtitle small muted">10 月 13 日 · '+esc(me().name)+' · '+esc(a.area)+'<br>现有时段：'+reservations(id).concat(loans(id)).map(range).join('，')+'</p><form id="book-form"><div class="kv"><label>开始时间<input id="book-start" name="start" type="time" value="12:00" required></label><label>结束时间<input id="book-end" name="end" type="time" value="13:00" required></label></div><p class="explain">有效预约和借用不可重叠。10:00–12:00 后，可以接着预约 12:00–13:00。</p><div id="form-error" class="form-error" role="alert"></div><div class="buttons">'+btn('返回','type="button" data-close-modal','light')+btn('确认预约','type="submit" id="confirm-book"')+'</div></form>'}
else if(kind==='return'){const l=state.loans.find(x=>x.id===id);html='<h2 id="modal-title">接收'+esc(asset(l.asset_id).name)+'归还</h2><p class="subtitle small muted">'+esc(person(l.resident_id).name)+' · '+l.id+' · '+range(l)+'<br>请确认归还时的状况。</p><form id="return-form"><label class="radio"><input type="radio" name="condition" value="normal" checked>状况正常，可以接着使用</label><label class="radio"><input id="return-damaged" type="radio" name="condition" value="damaged">发现损坏，转入维修</label><label>发现的问题<textarea id="return-issue" name="issue" placeholder="例如：针脚跳线，需要检修" maxlength="180"></textarea></label><p class="explain">损坏时暂停借出，保留并提示受影响的已有预约。一次借用只接收一次。</p><div id="form-error" class="form-error" role="alert"></div><div class="buttons">'+btn('返回','type="button" data-close-modal','light')+btn('确认接收归还','type="submit" id="confirm-return"')+'</div></form>'}
else {const m=state.repairs.find(x=>x.id===id);html='<h2 id="modal-title">确认'+esc(asset(m.asset_id).name)+'检修完成</h2><p class="subtitle small muted">'+m.id+' · '+esc(m.issue)+'</p><div class="notice ok">设备恢复可使用。原维修记录与预约保留，待借出预约继续由志愿者办理。</div><div class="buttons">'+btn('返回','type="button" data-close-modal','light')+btn('确认检修完成','id="confirm-repair" data-complete-repair="'+id+'"')+'</div>'}
$('#modal-host').innerHTML='<div class="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">'+html+'</section></div>';$('.modal').focus()}
function openCase(type,id){if(!steward()){const list=type==='loan'?state.loans:type==='reservation'?state.reservations:[],r=list.find(x=>x.id===id);if(!r||r.resident_id!==ui.person){message('这里只能查看你自己的借用和预约。',true);return}}ui.caseType=type;ui.caseId=id;if(ui.route==='assets'){const list=type==='loan'?state.loans:type==='reservation'?state.reservations:state.repairs;ui.asset=list.find(x=>x.id===id).asset_id;ui.view='detail'}else ui.view='case';render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.id==='reset'){state=copy(FIXTURES);state.events=[];ui.view='home';closeModal();render();message('已回到原始记录，三条路线从同一场景开始。');return}
if(b.dataset.route){ui.route=b.dataset.route;ui.view='home';closeModal();render();window.scrollTo(0,0);return}
if(b.dataset.nav){ui.view=b.dataset.nav;render();window.scrollTo(0,0);return}
if(b.dataset.openAsset){ui.asset=b.dataset.openAsset;ui.view='detail';render();window.scrollTo(0,0);return}
if(b.dataset.openCase){const [type,id]=b.dataset.openCase.split(':');openCase(type,id);return}
if(b.dataset.book){modal('book',b.dataset.book);return}
if(b.dataset.return){modal('return',b.dataset.return);return}
if(b.dataset.repair){modal('repair',b.dataset.repair);return}
if(b.dataset.checkout){run({type:'checkout',id:b.dataset.checkout});return}
if(b.dataset.cancel){run({type:'cancel',id:b.dataset.cancel});return}
if(b.hasAttribute('data-close-modal')){closeModal();return}
if(b.dataset.completeRepair){const r=run({type:'repair',id:b.dataset.completeRepair});if(r.ok)closeModal();return}});
document.addEventListener('change',e=>{if(e.target.id==='persona'){ui.person=e.target.value;ui.view='home';closeModal();render();window.scrollTo(0,0)}});
document.addEventListener('input',e=>{if(e.target.id==='asset-search'){document.querySelectorAll('[data-asset-card]').forEach(card=>card.hidden=!card.dataset.search.includes(e.target.value.trim()))}});
document.addEventListener('submit',e=>{if(e.target.id==='book-form'){e.preventDefault();const d=new FormData(e.target),r=run({type:'book',assetId:ui.modal.id,start:d.get('start'),end:d.get('end')});if(r.ok)closeModal();else $('#form-error').textContent=r.text}if(e.target.id==='return-form'){e.preventDefault();const d=new FormData(e.target),r=run({type:'return',id:ui.modal.id,damaged:d.get('condition')==='damaged',issue:d.get('issue')});if(r.ok)closeModal();else $('#form-error').textContent=r.text}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){closeModal();return}if(e.key==='Tab'&&ui.modal){const n=[...document.querySelectorAll('.modal button,.modal input,.modal textarea')].filter(x=>!x.disabled),first=n[0],last=n[n.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('.modal'))){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.workshopDemo=Object.freeze({snapshot:()=>copy(state),ui:()=>copy(ui),fixtures:()=>copy(FIXTURES)});
render();
</script></body></html>
