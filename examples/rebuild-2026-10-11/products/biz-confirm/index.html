<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#283b31">
  <title>留白 · 小团队请假管理</title>
  <link rel="stylesheet" href="styles.css">
  <script src="domain.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="index.html" aria-label="留白首页"><span class="brand-mark">✳</span><span>留白<small>把时间留给生活</small></span></a>
      <div class="workspace-label">TEAM WORKSPACE</div>
      <div class="team-name"><span class="team-mark">小</span> 我们的小团队 <span class="team-size">3 人</span></div>
      <nav class="main-nav" aria-label="主导航">
        <button class="nav-btn active" data-page="overview"><span data-icon="overview"></span>我的概览</button>
        <button class="nav-btn" data-page="requests"><span data-icon="document"></span><span id="requests-nav-label">我的申请</span></button>
        <button class="nav-btn" data-page="calendar"><span data-icon="calendar"></span>团队日历</button>
        <button class="nav-btn" data-page="approvals" hidden><span data-icon="check"></span>待我确认<span class="nav-count" id="approval-count">0</span></button>
      </nav>
      <div class="sidebar-note"><div class="note-art"><span></span><i></i><b>↗</b></div><strong>好好工作，也好好休息。</strong><p>提前安排，让每一次暂离<br>都有清晰的交接。</p></div>
      <div class="identity-box"><span class="avatar" id="sidebar-avatar">乔</span><div><label for="identity-select">本地演示 · 切换身份</label><select id="identity-select" aria-label="本地演示身份"><option value="qiao">乔雨 · 成员</option><option value="tang">唐辰 · 成员</option><option value="lin">林言 · 负责人</option></select></div></div>
    </aside>
    <div class="main-shell">
      <header class="topbar"><div><span class="breadcrumb-root">工作台</span><span class="breadcrumb-sep">/</span><span id="breadcrumb">我的概览</span></div><div class="topbar-right"><span class="demo-pill"><i></i> 本地演示</span><span class="avatar small" id="top-avatar">乔</span></div></header>
      <main id="main-content" tabindex="-1"></main>
      <footer class="app-footer"><span>留白 · 小团队的休息协作</span><span>数据保存在当前浏览器 · 身份切换仅用于演示</span></footer>
    </div>
  </div>
  <dialog id="request-dialog" class="form-dialog">
    <form id="request-form" novalidate>
      <div class="dialog-heading"><div><span class="eyebrow">TIME OFF REQUEST</span><h2 id="request-title">为自己留一点时间</h2></div><button type="button" class="icon-button" data-close="request-dialog" aria-label="关闭">×</button></div>
      <p class="dialog-intro" id="request-intro">提交后由林言确认，确认前不会计入团队请假。</p>
      <label class="field-label" for="leave-type">请假类型</label><select id="leave-type" name="type"><option>年假</option><option>事假</option><option>病假</option><option>调休</option></select>
      <div class="date-fields"><div><label class="field-label" for="start-date">开始日期</label><input type="date" id="start-date" name="start" required></div><div><label class="field-label" for="end-date">结束日期</label><input type="date" id="end-date" name="end" required></div></div>
      <div class="duration-preview" id="duration-preview">选择日期后计算工作日</div>
      <label class="field-label" for="leave-reason">请假说明 <span>选填 · 本人及负责人可见</span></label><textarea id="leave-reason" name="reason" rows="3" maxlength="300" placeholder="例如：个人安排，已将待办事项交接给同事。"></textarea>
      <div class="field-meta"><span>按周一至周五计天，含首尾；不含法定节假日调整。</span><span id="reason-count">0 / 300</span></div>
      <p class="form-error" id="request-error" role="alert" hidden></p>
      <div class="dialog-actions"><button type="button" class="button secondary" data-close="request-dialog">暂不提交</button><button class="button primary" id="submit-request" type="submit">提交申请 <span>↗</span></button></div>
    </form>
  </dialog>
  <dialog id="decision-dialog" class="form-dialog">
    <form id="decision-form" novalidate><div class="dialog-heading"><h2 id="decision-title">确认这笔申请</h2><button type="button" class="icon-button" data-close="decision-dialog" aria-label="关闭">×</button></div><div id="decision-summary" class="decision-summary"></div><label for="decision-comment" class="field-label" id="decision-comment-label">处理说明（选填）</label><textarea id="decision-comment" maxlength="300" rows="3" placeholder="处理说明会展示给申请人。"></textarea><p class="form-error" id="decision-error" role="alert" hidden></p><div class="dialog-actions"><button type="button" class="button secondary" data-close="decision-dialog">返回</button><button type="submit" class="button primary" id="confirm-decision">确认</button></div></form>
  </dialog>
  <dialog id="withdraw-dialog" class="form-dialog small-dialog">
    <div class="dialog-heading"><h2>申请撤回这笔请假？</h2><button type="button" class="icon-button" data-close="withdraw-dialog" aria-label="关闭">×</button></div><p class="dialog-intro" id="withdraw-intro">撤回也需要林言确认。在获确认前，原已生效的请假仍保留。</p><p class="form-error" id="withdraw-error" role="alert" hidden></p><div class="dialog-actions"><button type="button" class="button secondary" data-close="withdraw-dialog">保留申请</button><button type="button" class="button primary" id="confirm-withdraw">提交撤回请求</button></div>
  </dialog>
  <dialog id="details-dialog" class="form-dialog details-dialog"><div class="dialog-heading"><div><span class="eyebrow">REQUEST DETAILS</span><h2>申请详情</h2></div><button class="icon-button" data-close="details-dialog" aria-label="关闭">×</button></div><div id="details-content"></div></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
