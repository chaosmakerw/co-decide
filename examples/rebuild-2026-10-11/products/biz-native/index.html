<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#28644e">
  <title>休假小站 · 团队请假管理</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <a href="#overview" class="brand">
        <span class="brand-mark"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 25V14m0 4C6 19 5 10 6 7c8 0 12 4 10 11Zm0-3c0-7 4-10 11-9 0 7-3 11-11 9Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span>休假小站<small>TIME OFF, WELL SPENT.</small></span>
      </a>
      <div class="workspace-label"><span class="workspace-dot"></span> 我们的小团队 <span class="workspace-count">3</span></div>
      <div class="nav-label">工作空间</div>
      <nav id="navigation"></nav>
      <div class="sidebar-bottom">
        <div class="rest-note"><span class="rest-sun">☀</span><strong>好好工作，也好好休息。</strong><p>把假期安排好，<br>给自己一点放松的时间。</p><span class="rest-leaf"></span></div>
        <div class="demo-note"><span class="demo-dot"></span><span>本地演示环境<small>合成数据 · 本机保存</small></span><span class="demo-info" title="身份切换仅用于演示，不是真实认证。数据不会跨设备共享。">i</span></div>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="breadcrumb"><span>工作空间</span><span class="breadcrumb-slash">/</span><strong id="breadcrumb-title">团队概览</strong></div>
        <div class="topbar-actions"><span id="header-date" class="header-date"></span><span class="topbar-divider"></span><button class="icon-button notification-button" data-action="notifications" aria-label="查看协商提醒"><span id="notification-icon"></span><i id="notification-dot" hidden></i></button><div class="profile-wrap"><button id="profile-button" class="profile-button" data-action="profile" aria-expanded="false" aria-label="切换演示身份"></button><div id="profile-menu" class="popover profile-menu" hidden></div></div></div>
      </header>
      <div class="demo-ribbon">本地演示 · 身份切换不代表真实登录，数据仅保存在本机</div>
      <main id="main" tabindex="-1"><div class="loading-state"><span class="loader"></span><p>正在准备你的团队工作台…</p></div></main>
      <footer class="page-footer"><span>小团队的假期，井井有条。</span><span>休假小站 <span class="footer-dot">·</span> 本地演示</span></footer>
    </div>
  </div>
  <dialog id="apply-dialog" class="modal apply-modal" aria-labelledby="apply-title">
    <form id="apply-form">
      <div class="modal-header"><div><span class="eyebrow">TAKE A LITTLE BREAK</span><h2 id="apply-title">登记休假</h2><p>提交即登记生效，安排好交接，安心休假。</p></div><button type="button" class="icon-button" data-action="close-dialog" aria-label="关闭"><span class="close-icon">×</span></button></div>
      <div class="modal-body">
        <div id="applicant-summary" class="applicant-summary"></div>
        <label class="field-label" for="leave-type">休假类型 <span>*</span></label>
        <select id="leave-type" name="type" required><option value="annual">年假</option><option value="personal">事假</option><option value="sick">病假</option><option value="comp">调休</option></select>
        <div class="date-fields"><div><label class="field-label" for="start-date">开始日期 <span>*</span></label><div class="date-pair"><input id="start-date" name="startDate" type="date" required><select name="startPeriod" id="start-period" aria-label="开始时段"><option value="am">上午</option><option value="pm">下午</option></select></div></div><div><label class="field-label" for="end-date">结束日期 <span>*</span></label><div class="date-pair"><input id="end-date" name="endDate" type="date" required><select name="endPeriod" id="end-period" aria-label="结束时段"><option value="pm">下午</option><option value="am">上午</option></select></div></div></div>
        <div class="duration-preview" id="duration-preview"></div>
        <div class="coordination-hint" id="coordination-preview" role="status" aria-live="polite" hidden></div>
        <label class="field-label" for="leave-reason">请假事由 <span>*</span><small>仅本人和负责人可见</small></label><textarea id="leave-reason" name="reason" rows="3" required minlength="2" maxlength="300" placeholder="简单说明你的休假安排（2–300 字）"></textarea>
        <label class="field-label" for="leave-handover">工作交接 <small>选填</small></label><textarea id="leave-handover" name="handover" rows="2" maxlength="300" placeholder="需要交接的事项、接手人或相关文档"></textarea>
        <p id="apply-error" class="form-error" role="alert" hidden></p>
      </div>
      <div class="modal-footer"><span class="submission-note">提交即登记生效，无需审批</span><button type="button" class="button button-secondary" data-action="close-dialog">取消</button><button type="submit" class="button button-primary" id="submit-request">提交登记<span>↗</span></button></div>
    </form>
  </dialog>
  <dialog id="detail-dialog" class="modal detail-modal" aria-labelledby="detail-title"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
