<body><main class="page">
<header><div><div class="eyebrow">TRIO / SESSION ROOM</div><h1>把音乐，排进这一周。</h1><p class="muted">三个人，一支乐队。找到下一次一起发声的方式。</p></div><span class="pill">交互小样 · 日程与练习内容为演示</span></header>
<p class="topnote"><span>苏宜 / 主唱</span><span>韩楚 / 吉他</span><span>许棠 / 鼓</span><span>10.12—10.18</span></p>
<nav class="nav" aria-label="候选路线"><a href="prototype.html?mode=joint" data-mode="joint"><b>01 / 一起到齐</b><span>先找共同空档，再成立一场</span></a><a href="prototype.html?mode=fragments" data-mode="fragments"><b>02 / 片段拼场</b><span>先排能练的组合，保留未练项</span></a><a href="prototype.html?mode=rhythm" data-mode="rhythm"><b>03 / 固定锚点</b><span>保留每周一晚，单次处理例外</span></a></nav>
<section id="app" aria-live="polite"></section>
<section class="panel guide" id="guide"></section>
<div class="foot"><span>成员资料来自 members.csv。空闲、曲目、进度与未来日程均为本机演示，刷新还原；没有真实通知或预订。按测试约束离线制作，未使用外部参考。</span><button id="reset-all">还原同一组演示输入</button></div>
</main>
<script>
// 共享资料与业务逻辑：纯函数，不读取页面或保存状态。
const BandModel = (() => {
  const members=[{name:'苏宜',instrument:'主唱'},{name:'韩楚',instrument:'吉他'},{name:'许棠',instrument:'鼓'}];
  const slots=[{day:'周二',date:'10/13',time:'20:00–22:00',start:1200},{day:'周四',date:'10/15',time:'20:00–22:00',start:1200},{day:'周日',date:'10/18',time:'15:00–17:00',start:900}];
  const tasks=[{id:'voice',name:'人声咬字',need:[0,1],minutes:60},{id:'beat',name:'节奏对齐',need:[1,2],minutes:60},{id:'full',name:'整首合奏',need:[0,1,2],minutes:60}];
  function initial(){return {availability:[[true,true,false],[true,false,true],[false,true,true]],joint:null,full:false,plan:null,done:[],rhythm:{active:false,slot:1,skip:false,move:null},message:'同一组演示输入：每个时段都有两人能来，但没有三人共同空档。'};}
  function common(s){return slots.map((_,j)=>j).filter(j=>members.every((_,i)=>s.availability[i][j]));}
  function fragmentPlan(s){let used=slots.map(()=>[0,0,0]);return tasks.filter(t=>t.id!=='full'||s.full).map(t=>{const j=slots.findIndex((_,j)=>t.need.every(i=>s.availability[i][j])&&Math.max(...t.need.map(i=>used[j][i]))+t.minutes<=120);if(j<0)return {...t,slot:null};const offset=Math.max(...t.need.map(i=>used[j][i]));t.need.forEach(i=>used[j][i]=offset+t.minutes);return {...t,slot:j,offset};});}
  function act(s,a){const n=JSON.parse(JSON.stringify(s));
    if(a.type==='availability'){n.availability[a.member][a.slot]=a.value===undefined?!n.availability[a.member][a.slot]:a.value;n.message=members[a.member].name+'的'+slots[a.slot].day+'已改为'+(n.availability[a.member][a.slot]?'有空。':'没空。')+'三个候选共用这份空闲信息。';}
    if(a.type==='book'){const eligible=common(n);const chosen=a.slot===undefined?eligible[0]:a.slot;if(chosen===undefined||!eligible.includes(chosen)){n.message='没有共同空档，本轮未新增排练。请调整一个时段，再尝试安排。';}else{n.joint=chosen;n.message='已安排'+slots[chosen].day+' '+slots[chosen].time+'，三人的空闲都匹配。';}}
    if(a.type==='full'){n.full=a.value===undefined?!n.full:a.value;n.plan=null;n.done=[];n.message=n.full?'整首合奏已加入本轮任务，必须三人同时有空。请重新拼场。':'本轮只安排两段练习；整首合奏仍保留为未练项。请重新拼场。';}
    if(a.type==='plan'){n.plan=fragmentPlan(n);n.done=[];const missing=n.plan.filter(t=>t.slot===null);n.message='拼出'+n.plan.filter(t=>t.slot!==null).length+'场片段练习。'+(missing.length?'仍无法排入：'+missing.map(t=>t.name).join('、')+'。':'整首合奏没有自动完成，需实际练完。');}
    if(a.type==='done'){if(!n.plan){n.message='先拼场，再标记练完；本轮未改变任何练习进度。';}else{n.done=n.plan.filter(t=>t.slot!==null&&t.need.every(i=>n.availability[i][t.slot])).map(t=>t.id);n.message='已将当前能到场的片段标为练完（演示）。'+(n.done.includes('full')?'整首合奏也已标为练完。':'整首合奏仍未练，不会因为两个小组完成而自动通过。');}}
    if(a.type==='rhythm'){n.rhythm={active:true,slot:a.slot,skip:false,move:null};n.message='每周'+slots[a.slot].day+'的固定计划已建立。本周按当前空闲核对，后两周只是保留计划，尚未核对空闲。';}
    if(a.type==='skip'){if(!n.rhythm.active)n.message='尚未建立固定计划，不能暂停某一次。';else{n.rhythm.skip=!n.rhythm.skip;n.message=n.rhythm.skip?'仅暂停本周这一场；后两周的固定计划仍保留。':'已恢复本周计划；仍需核对是否全员有空。';}}
    if(a.type==='move'){if(!n.rhythm.active)n.message='先建立固定计划，才能单独移动本周。';else if(!common(n).includes(a.slot))n.message='改期未生效：'+slots[a.slot].day+'仍有人没空。本周状态及后续固定计划均保留。';else{n.rhythm.move=a.slot;n.rhythm.skip=false;n.message='仅本周移到'+slots[a.slot].day+'；后两周仍按固定'+slots[n.rhythm.slot].day+'保留。';}}
    return n;
  }
  function jointStatus(s){return s.joint===null?'尚未成立':common(s).includes(s.joint)?'已安排 · 三人同场':'待重排 · 有成员临时没空';}
  function currentRhythm(s){if(!s.rhythm.active)return '尚未建立';if(s.rhythm.skip)return '本周暂停';const j=s.rhythm.move===null?s.rhythm.slot:s.rhythm.move;return common(s).includes(j)?'本周已安排 · 三人同场':'本周有冲突 · 待处理';}
  return {members,slots,tasks,initial,common,fragmentPlan,act,jointStatus,currentRhythm};
})();
</script>
<script>
const M=BandModel, mode=new URLSearchParams(location.search).get('mode');
let route=['joint','fragments','rhythm'].includes(mode)?mode:'joint', state=M.initial(), guideChoice='base', guideStep=0, guideStarted=false;
document.querySelector('[data-mode="'+route+'"]').classList.add('active');
const people=ids=>ids.map(i=>M.members[i].name).join('＋');
const time=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const slotLabel=j=>M.slots[j].day+' '+M.slots[j].time;
function availability(){return `<h3>这周，什么时候能来？</h3><div class="label">示例空闲 · 点一下修改</div><table class="availability"><thead><tr><th>成员</th>${M.slots.map(t=>`<th>${t.day}<br>${t.time}</th>`).join('')}</tr></thead><tbody>${M.members.map((p,i)=>`<tr><td class="person"><strong>${p.name}</strong><small>${p.instrument}</small></td>${M.slots.map((_,j)=>`<td><button class="${state.availability[i][j]?'yes':'no'}" data-avail="${i},${j}" aria-label="${p.name}${M.slots[j].day}空闲：${state.availability[i][j]?'有空':'没空'}">${state.availability[i][j]?'有空 ✓':'没空 —'}</button></td>`).join('')}</tr>`).join('')}</tbody></table>`;}
function instrumentMark(i){return `<svg viewBox="0 0 36 36" aria-hidden="true">${['<rect x="13" y="3" width="10" height="18" rx="5"/><path d="M9 15v3a9 9 0 0 0 18 0v-3M18 27v6M12 33h12M15 9h6M15 13h6"/>','<path d="M21 14l7-8 3 3-8 8M22 17c4 4 4 8-1 12s-10 3-13 0-4-8 0-12c3-3 7-3 10-1l3-2"/><circle cx="17" cy="21" r="3"/><path d="M11 28l5-5M28 6l2-2M31 9l2-2"/>','<ellipse cx="18" cy="13" rx="12" ry="5"/><path d="M6 13v13c0 7 24 7 24 0V13M12 17v13M24 17v13M3 4l14 9M33 3L20 13"/>'][i]}</svg>`;}
function memberViews(lines){return `<div class="members">${M.members.map((p,i)=>`<div class="member"><div class="row"><b>${p.name}</b><span class="label">${p.instrument}</span></div><p>${lines[i]}</p></div>`).join('')}</div>`;}
function joint(){const common=M.common(state), valid=state.joint!==null&&common.includes(state.joint), status=M.jointStatus(state);const lines=M.members.map((p,i)=>state.joint===null?'还没有排练。下一步：调整空闲，找一个三人同场的时段。':valid?'下一场：'+slotLabel(state.joint)+'，与另外两位合奏。':state.availability[i][state.joint]?'原'+slotLabel(state.joint)+'不再满足全员同场，先别按原计划出发。':'你当前不能参加原定场次，请与大家重新找档。');return `<section class="panel"><div class="scene"><div><div class="eyebrow">01 / ALL IN THE ROOM</div><h2>缺一个，就再找一晚。</h2><p class="muted">主唱、吉他、鼓。三个席位同时有空，才成立一场合奏。</p></div><span class="badge ${valid?'':'warn'}">${status}</span></div><div class="grid joint-layout"><div class="joint-console"><div class="stage-room"><div class="stage-center"><div class="eyebrow">REHEARSAL ROOM / 3 SEATS</div><div class="stage-status">${valid?'已成场':common.length?'可以齐人':'还没齐'}</div><div class="label">${valid?slotLabel(state.joint):'下一场，需要三个人的共同空档'}</div></div><div class="stage-seats">${M.members.map((p,i)=>`<div class="stage-seat">${instrumentMark(i)}<b>${p.name}</b><small>${p.instrument}</small></div>`).join('')}</div><div class="stage-lip">ONE BAND / ONE SESSION</div></div><div class="actions"><button class="primary" id="book-joint">安排共同空档</button></div></div><div class="joint-controls">${availability()}<div class="callout"><div class="kicker">当前可一起排练的时段</div><div class="big">${common.length} 个共同空档</div><p>${common.length?'可以安排一场三人合奏。':'周二缺鼓、周四缺吉他、周日缺主唱。没有一场能齐人。'}</p></div>${common.map(j=>`<div class="slot"><div><b>${M.slots[j].day}</b><br><small>${M.slots[j].time}</small></div><button data-book="${j}">安排这场</button></div>`).join('')}${state.joint!==null?`<div class="empty"><b>已记录的场次</b><p>${slotLabel(state.joint)}</p><span class="badge ${valid?'':'warn'}">${status}</span></div>`:''}<div class="boundary">收益：不会把缺一人的集合当成全员排练。代价：没人愿意改时间时，这周会排不出任何一场。空闲变化会使原场次进入“待重排”。</div></div></div>${memberViews(lines)}</section>`;}
function fragments(){const planned=state.plan||[], completed=state.done.length;const valid=t=>t.slot!==null&&t.need.every(i=>state.availability[i][t.slot]);const lines=M.members.map((p,i)=>{const mine=planned.filter(t=>t.slot!==null&&t.need.includes(i));if(!mine.length)return '尚无你的具体场次。下一步：拼场，查看可练的片段。';return mine.map(t=>(state.done.includes(t.id)?'已练：':valid(t)?'下一场：':'有冲突：')+t.name+' / '+M.slots[t.slot].day+' '+time(M.slots[t.slot].start+t.offset)+'–'+time(M.slots[t.slot].start+t.offset+t.minutes)).join('<br>')+(mine.length>1?'<br>你要到场 '+mine.length+' 次；请留意往返成本。':'');});return `<section class="panel"><div class="scene"><div><div class="eyebrow">02 / WORK ON THE PARTS</div><h2>先让两段，响起来。</h2><p class="muted">《夜行》练习带 · 声部各自推进，最后再汇成整首。</p></div><span class="badge">${planned.filter(valid).length} 场当前可练 · ${completed}/3 项练完</span></div><div class="grid track-layout"><div class="tasks tracks"><div class="track-ruler"><span>夜行 / 3 TRACKS</span>${M.slots.map(t=>`<span>${t.day} ${t.date}</span>`).join('')}</div>${M.tasks.map((t,k)=>{const plan=planned.find(x=>x.id===t.id);let info=plan?plan.slot===null?'没有全员空档 · 保留为待排':valid(plan)?M.slots[plan.slot].day+' '+time(M.slots[plan.slot].start+plan.offset)+'–'+time(M.slots[plan.slot].start+plan.offset+plan.minutes):'原排期出现冲突 · 请重新拼场':t.id==='full'&&!state.full?'留在曲目待办 · 本轮未安排':'点击“按空档拼场”后生成排期';return `<div class="task ${state.done.includes(t.id)?'done':''}"><div class="task-head"><div class="num">TRACK 0${k+1} ${state.done.includes(t.id)?'· 已练完':''}</div>${t.id==='full'?`<label><input type="checkbox" id="include-full" ${state.full?'checked':''}><div><h3>${t.name}</h3><small>加入本轮排期</small></div></label>`:`<h3>${t.name}</h3>`}<p class="muted">${people(t.need)}<br>${t.minutes} 分钟</p></div><div class="track-space">${M.slots.map((_,j)=>`<div class="track-cell">${plan&&plan.slot===j?`<div class="clip ${valid(plan)?'':'conflict'}"><small>${info}</small>${state.done.includes(t.id)?'<small>已练完 ✓</small>':''}</div>`:''}</div>`).join('')}${!plan||plan.slot===null?`<div class="track-empty">${info}</div>`:''}</div></div>`;}).join('')}<div class="actions"><button class="primary" id="plan-fragments">按空档拼场</button><button id="complete-fragments">标记可练的片段已练完</button></div></div><div class="mix-sidebar">${availability()}<div class="callout"><b>整首合奏 ${state.done.includes('full')?'已练完':'仍未练'}</b><div class="progress"><span style="width:${completed/3*100}%"></span></div><p>小组完成只推进对应片段；三人一起练整首，是独立的一项。</p></div>${M.members.map((p,i)=>{const mine=planned.filter(t=>valid(t)&&t.need.includes(i));return `<div class="workload"><span>${p.name}</span><span>${mine.length} 次到场 · ${mine.reduce((n,t)=>n+t.minutes,0)} 分钟</span></div>`;}).join('')}<div class="boundary">收益：没有共同空档也能推进人声与节奏。代价：韩楚要分别参加两场；两组练完仍不证明三人合奏已练好。只安排当前有空的组合，不会在同一时段重复占用一个成员。</div></div></div>${memberViews(lines)}</section>`;}
function rhythm(){const r=state.rhythm,j=r.move===null?r.slot:r.move,current=M.currentRhythm(state);const lines=M.members.map((p,i)=>!r.active?'尚无固定计划。下一步：选一个固定晚。':r.skip?'本周已暂停；下周'+M.slots[r.slot].day+'仍保留计划，需重新核对空闲。':!state.availability[i][j]?'你本周'+M.slots[j].day+'没空，当前场次有冲突；可协调改期或暂停本周。':M.common(state).includes(j)?'本周'+slotLabel(j)+'已安排；后两周固定计划保留，空闲尚未核对。':'你本周有空，但仍有人冲突；请等本周安排处理。后续固定计划保留。');return `<section class="panel"><div class="scene"><div><div class="eyebrow">03 / KEEP THE WEEKLY BEAT</div><h2>每周，留一晚给乐队。</h2><p class="muted">固定节奏在前，这一次的例外在后。跳过一场，下一页照常。</p></div><span class="badge ${r.active?'':'warn'}">${r.active?'每周'+M.slots[r.slot].day+'已保留':'尚未建立固定计划'}</span></div><div class="rhythm-binding"><span class="label">THE WEEKLY REHEARSAL / OCTOBER</span><div class="selectrow"><label for="recurring-slot">固定晚</label><select id="recurring-slot">${M.slots.map((t,i)=>`<option value="${i}" ${i===r.slot?'selected':''}>每周${t.day} ${t.time}</option>`).join('')}</select><button class="primary" id="activate-rhythm">建立固定计划</button></div></div><div class="weeks">${['本周','下周','两周后'].map((w,k)=>`<article class="week ${k===0?'current':''}"><div class="kicker">${w} · ${['10/12–18','10/19–25','10/26–11/1'][k]}</div><span class="folio" aria-hidden="true">0${k+1}</span><div class="date">${M.slots[r.active?k===0?j:r.slot:r.slot].day}</div><small>${r.active?M.slots[k===0?j:r.slot].time:M.slots[r.slot].time+' · 候选锚点'}</small><div class="state"><span class="badge ${k===0&&!current.includes('已安排')?'warn':''}">${!r.active?'尚无安排':k===0?current:'固定占位 · 空闲未核对'}</span></div><p class="label">${k===0?'本周按共享空闲表核对。':'未来空闲不沿用本周数据；占位不等于成员已确认。'}</p></article>`).join('')}</div><div class="grid rhythm-layout"><div>${availability()}</div><div><h3>处理这一次，不打断整段节奏</h3><div class="actions"><button id="skip-rhythm">${r.skip?'恢复本周':'仅暂停本周'}</button></div><div class="selectrow" style="margin-top:15px"><select id="move-slot" aria-label="本周改期目标">${M.slots.map((t,i)=>`<option value="${i}" ${i===2?'selected':''}>本周改到${t.day}</option>`).join('')}</select><button id="move-rhythm">仅改本周</button></div><div class="boundary">收益：一次冲突不会抹掉后面的固定计划，成员保留稳定节奏。代价：固定晚仍可能与成员习惯冲突；本周无法齐人时须处理，未来每次都需核对，不自动宣称全员能来。</div></div></div>${memberViews(lines)}</section>`;}
const guides={
joint:{base:{name:'没有交集',text:'先尝试安排，观察工具如何阻止“缺一人也算成立”。',steps:[{label:'尝试安排共同空档',action:{type:'book'}}]},happy:{name:'打通一个时段',text:'让韩楚周四有空，三人才第一次产生交集。',steps:[{label:'韩楚：周四可以来',action:{type:'availability',member:1,slot:1,value:true}},{label:'安排周四全员合奏',action:{type:'book',slot:1}}]},edge:{name:'临时又没空',text:'先成立周四一场，再让吉他手临时无法参加；原场次应明确待重排。',steps:[{label:'韩楚：周四可以来',action:{type:'availability',member:1,slot:1,value:true}},{label:'安排周四全员合奏',action:{type:'book',slot:1}},{label:'韩楚：周四临时不能来',action:{type:'availability',member:1,slot:1,value:false}}]}},
fragments:{base:{name:'先练两段',text:'相同输入没有全员空档，但能先生成两个小组，再观察“练完”并未替整首过关。',steps:[{label:'拼出本周两段练习',action:{type:'plan'}},{label:'两段练完了（演示）',action:{type:'done'}}]},happy:{name:'还要练整首',text:'整首合奏加入任务后，工具保留两场可练部分，同时明示整首缺口。',steps:[{label:'将整首合奏也加入排期',action:{type:'full',value:true}},{label:'重新按空档拼场',action:{type:'plan'}}]},edge:{name:'还没排就练完',text:'尝试在没有具体场次时标记完成；进度不应凭空增加。',steps:[{label:'尝试标记练完',action:{type:'done'}}]}},
rhythm:{base:{name:'跳过这一周',text:'建立周四固定晚后，发现韩楚没空；仅暂停本周，后两周计划应保留。',steps:[{label:'建立每周四固定计划',action:{type:'rhythm',slot:1}},{label:'仅暂停本周这一场',action:{type:'skip'}}]},happy:{name:'固定晚能齐人',text:'让韩楚周四有空，本周可安排；未来两周仍只能写“占位”，不能假定可来。',steps:[{label:'韩楚：周四可以来',action:{type:'availability',member:1,slot:1,value:true}},{label:'建立每周四固定计划',action:{type:'rhythm',slot:1}}]},edge:{name:'改到另一个冲突',text:'周日仍缺苏宜，所以单次改期应被阻止，固定计划保留。',steps:[{label:'建立每周四固定计划',action:{type:'rhythm',slot:1}},{label:'尝试仅本周改到周日',action:{type:'move',slot:2}}]}}
};
function guide(){const g=guides[route][guideChoice],done=guideStarted&&guideStep>=g.steps.length;return `<div class="guide-head"><h3 style="margin:0">按步骤体验边界</h3><span class="label">也可随时用上方按钮自由操作</span></div><div class="guide-tabs">${Object.entries(guides[route]).map(([key,x])=>`<button data-guide="${key}" class="${guideChoice===key?'active':''}">${x.name}</button>`).join('')}</div><div class="guide-body"><div><p>${g.text}</p><small>${guideStarted?'已完成 '+guideStep+'/'+g.steps.length+' 步':'开始后会还原同一组演示输入；不会替你选择最终路线。'}</small></div><button class="primary" id="guide-next">${!guideStarted?'开始这个情景':done?'重走这个情景':g.steps[guideStep].label}</button></div>`;}
function dispatch(a){state=M.act(state,a);render();}
function render(){document.getElementById('app').innerHTML=({joint,fragments,rhythm}[route])()+`<div class="last"><strong>刚才发生的变化</strong>${state.message}</div>`;document.getElementById('guide').innerHTML=guide();document.querySelectorAll('[data-avail]').forEach(b=>b.onclick=()=>{const [i,j]=b.dataset.avail.split(',').map(Number);dispatch({type:'availability',member:i,slot:j});});document.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>dispatch({type:'book',slot:Number(b.dataset.book)}));const bind=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f;};bind('book-joint',()=>dispatch({type:'book'}));bind('plan-fragments',()=>dispatch({type:'plan'}));bind('complete-fragments',()=>dispatch({type:'done'}));const full=document.getElementById('include-full');if(full)full.onchange=()=>dispatch({type:'full',value:full.checked});bind('activate-rhythm',()=>dispatch({type:'rhythm',slot:Number(document.getElementById('recurring-slot').value)}));bind('skip-rhythm',()=>dispatch({type:'skip'}));bind('move-rhythm',()=>dispatch({type:'move',slot:Number(document.getElementById('move-slot').value)}));document.querySelectorAll('[data-guide]').forEach(b=>b.onclick=()=>{guideChoice=b.dataset.guide;guideStarted=false;guideStep=0;render();});bind('guide-next',()=>{const g=guides[route][guideChoice];if(!guideStarted||guideStep>=g.steps.length){state=M.initial();guideStep=0;guideStarted=true;render();return;}state=M.act(state,g.steps[guideStep].action);guideStep++;render();});}
document.getElementById('reset-all').onclick=()=>{state=M.initial();guideStep=0;guideStarted=false;render();};render();
</script>
</body></html>
