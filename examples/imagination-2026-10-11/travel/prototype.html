<body>
<div class="prototype-note"><span>旅行见闻 · 方向体验小样</span><span>同一份 3 条合成记录 · 只在本次打开期间保留操作 · 刷新重置</span></div>
<main id="app"></main>
<nav class="prototype-switcher" aria-label="候选版本切换">
 <div class="switch-row"><button id="prev-variant" aria-label="上一个版本">←</button><div class="switch-tabs" id="switch-tabs"></div><button id="next-variant" aria-label="下一个版本">→</button></div>
 <div class="switch-state"><span id="state-summary"></span><button id="state-toggle" aria-expanded="false">查看本次状态</button></div>
 <pre class="state-panel" id="state-panel" hidden></pre>
</nav>
<script>
const notes=[
 {id:'n1',date:'2026-05-03',place:'海边小城',note:'雨停后绕到码头看渔船回来'},
 {id:'n2',date:'2026-07-16',place:'山间小镇',note:'在小店和老板聊了老车站'},
 {id:'n3',date:'2026-09-21',place:'旧城街区',note:'顺着钟声走进一条陌生小巷'}
];
const names={A:'路过档案馆',B:'折页旅行册',C:'拾景工作台'};
const state={tags:{},additions:{},collections:[],selected:'n2',query:'',filter:'all',draftIds:[],draftTitle:''};
let variant=['A','B','C'].includes(new URL(location.href).searchParams.get('variant'))?new URL(location.href).searchParams.get('variant'):'A';
const app=document.querySelector('#app');
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const selected=()=>notes.find(n=>n.id===state.selected);
const tagsFor=id=>state.tags[id]||[];
const extraFor=id=>state.additions[id]||'';
const miniDate=d=>d.slice(5).replace('-','.');
const tagsHtml=id=>tagsFor(id).map(t=>'<span class="tag">'+esc(t)+'</span>').join('');
function renderState(){
 const tags=Object.values(state.tags).reduce((sum,x)=>sum+x.length,0);
 document.querySelector('#state-summary').textContent='正在体验 '+variant+' · 3 条原文 / '+tags+' 个归类 / '+Object.keys(state.additions).length+' 段补写 / '+state.collections.length+' 束线索';
 document.querySelector('#state-panel').textContent=JSON.stringify({当前版本:names[variant],当前片段:selected().place,筛选:state.filter,搜索:state.query,归类:state.tags,补写:state.additions,已建立线索:state.collections,工作台当前选择:state.draftIds},null,2);
}
function renderSwitcher(){document.querySelector('#switch-tabs').innerHTML=Object.entries(names).map(([key,name])=>'<button class="'+(variant===key?'active':'')+'" data-variant="'+key+'" aria-current="'+(variant===key?'true':'false')+'">'+key+' '+name+'</button>').join('');renderState()}
function setVariant(key){
 variant=key;const url=new URL(location.href);url.searchParams.set('variant',key);history.replaceState(null,'',url);render();window.scrollTo(0,0);
}
function cycle(amount){const keys=Object.keys(names);setVariant(keys[(keys.indexOf(variant)+amount+3)%3])}
function archiveRows(){
 const q=state.query.trim().toLowerCase();
 const found=notes.filter(n=>(state.filter!=='tagged'||tagsFor(n.id).length)&&(state.filter!=='untagged'||!tagsFor(n.id).length)&&(!q||[n.date,n.place,n.note,...tagsFor(n.id),extraFor(n.id)].join(' ').toLowerCase().includes(q)));
 document.querySelector('#archive-results').innerHTML='<div class="row-summary"><span>日期 / 地点与见闻</span><span>'+found.length+' 条片段</span></div>'+found.map(n=>'<button class="archive-row '+(n.id===state.selected?'selected':'')+'" data-select="'+n.id+'"><span class="row-date">'+miniDate(n.date)+'<br>2026</span><span><span class="row-place">'+n.place+'</span><span class="row-note" style="display:block">'+n.note+'</span>'+tagsHtml(n.id)+'</span><span class="row-arrow">↗</span></button>').join('')+(found.length?'':'<div class="empty">没有匹配的片段。试试地点、“车站”，或清空搜索。</div>');
}
function archiveDetail(){
 const n=selected();document.querySelector('#archive-detail').innerHTML='<div class="eyebrow">正在整理 / '+n.id.slice(1).padStart(2,'0')+'</div><h2 class="serif">'+n.place+'</h2><div class="detail-date">'+n.date+'</div><p class="original serif">'+n.note+'</p><div class="detail-label">让下次能找回来</div><div id="detail-tags">'+(tagsHtml(n.id)||'<span class="muted" style="font-size:11px">还没有归类</span>')+'</div><form class="tag-form" id="tag-form"><input id="tag-input" aria-label="归类名称" maxlength="30" placeholder="如：人与对话"><button class="primary" type="submit">归类</button></form><p class="helper muted">搜索地点、原文或归类名，就能找回这段见闻。</p>'+(extraFor(n.id)?'<div class="detail-label">后来补写</div><p class="detail-extra">'+esc(extraFor(n.id))+'</p>':'')+'<div class="status" id="action-status" role="status"></div>';
}
function renderArchive(){
 app.innerHTML='<div class="archive-layout"><aside class="archive-side"><div><div class="brand serif">路过档案馆</div><small>私人旅行片段 · 2026</small></div><div class="side-rule"></div><div class="side-item active">▤　全部见闻</div><div class="side-item">03　三个地点</div><div class="archive-number"><strong class="serif">03</strong><p>小事也值得留住。</p></div></aside><section class="archive-main"><header class="archive-top"><div><div class="eyebrow">THE SMALL THINGS / 2026</div><h1 class="serif">把见闻放回有序的抽屉。</h1><p>记得几个词，也能再找到那一天。</p></div><div class="archive-stamp">路过<br>已收录 3 条</div></header><div class="archive-work"><section><div class="search-wrap"><span>⌕</span><input id="search" aria-label="搜索旅行片段" placeholder="搜索地点、见闻、归类…" value="'+esc(state.query)+'"></div><div class="filters">'+[['all','全部'],['untagged','未归类'],['tagged','已归类']].map(([key,title])=>'<button class="pill '+(state.filter===key?'active':'')+'" data-filter="'+key+'">'+title+'</button>').join('')+'</div><div id="archive-results"></div></section><aside class="archive-detail" id="archive-detail"></aside></div></section></div>';
 archiveRows();archiveDetail();
 document.querySelector('#search').addEventListener('input',e=>{state.query=e.target.value;archiveRows();renderState()});
}
function art(id){
 const paths={n1:'<path d="M0 110Q70 80 140 106T280 106T420 105T600 105M0 135Q70 110 140 134T280 134T420 133T600 133" fill="none" stroke="#8c9a8d" stroke-width="2"/><path d="M225 95h118l-21 25h-78z" fill="#596f66"/><path d="M281 95V30L333 90z" fill="#c6b79e"/><path d="M281 30V96" stroke="#596f66" stroke-width="3"/><circle cx="490" cy="37" r="25" fill="#dbc593"/>',n2:'<path d="M0 155L120 45l105 105 117-125 152 130" fill="#bac0a4"/><path d="M0 164L135 101l137 68 195-102 133 101" fill="#91a18d"/><path d="M235 99h105v53H235z" fill="#ebe0c6"/><path d="M225 101l63-40 62 40" fill="#9c6e50"/><path d="M265 124h17v28h-17m30-29h25v17h-25" fill="#a6906c"/><path d="M0 162h600" stroke="#6e806a" stroke-width="2"/>',n3:'<path d="M0 12h200v160H0zm400 0h200v160H400z" fill="#c5b7a7"/><path d="M200 172l90-65h20l90 65" fill="#a99480"/><path d="M264 103V35a36 36 0 0 1 72 0v68" fill="#b79978"/><path d="M289 95V64a11 11 0 0 1 22 0v31" fill="#725d4c"/><circle cx="300" cy="37" r="13" fill="#e2d2ae"/><path d="M300 28v9l6 4" fill="none" stroke="#8e7050" stroke-width="2"/><path d="M28 38h36v53H28m38 35h36v53H66m418-35h36v53h-36m42-55h36v53h-36" fill="#e1d3bf"/>'};
 return '<svg viewBox="0 0 600 175" role="img" aria-label="装饰性旅行版画，不是实景照片">'+paths[id]+'</svg>';
}
function renderJournal(){
 const n=selected(),idx=notes.indexOf(n),titles={n1:'雨停之后，<br>在码头多待一会儿。',n2:'一间小店，<br>一座被聊起的老车站。',n3:'让一阵钟声，<br>带我拐进陌生小巷。'},prompts={n1:'等渔船回来时，你还注意到了什么？',n2:'关于老车站，你还记得聊到了什么？',n3:'走进小巷之后，你还记得什么？'};
 app.innerHTML='<div class="journal-page"><header class="journal-header"><div class="journal-wordmark serif">折页旅行册</div><small>不是赶路，是记住路过。 / 2026</small></header><section class="journal-book"><aside class="journal-contents"><p>本册 · 三页</p>'+notes.map((x,i)=>'<button class="journal-tab '+(x.id===n.id?'active':'')+'" data-select="'+x.id+'">'+miniDate(x.date)+'<span>'+x.place+'</span></button>').join('')+'</aside><article class="journal-sheet"><div class="journal-date"><strong class="serif">'+miniDate(n.date)+'</strong><span>2026<br>'+n.place+'</span></div><h1 class="serif">'+titles[n.id]+'</h1><div class="journal-art">'+art(n.id)+'</div><div class="art-caption"><span>沿路的一页 / '+n.place+'</span><span>装饰版画 · 非实景</span></div><p class="journal-quote serif">'+n.note+'</p><div class="art-caption"><span>见闻原文</span><span>'+n.date+'</span></div><div class="journal-bottom"><button data-page="-1" '+(idx===0?'disabled':'')+'>← 上一页</button><span>'+(idx+1)+' / 3</span><button data-page="1" '+(idx===2?'disabled':'')+'>下一页 →</button></div></article><aside class="journal-margin"><div class="eyebrow">A NOTE IN THE MARGIN</div><h2 class="serif">写在页边，<br>留给以后的自己。</h2><p class="helper">不必写成一篇游记。补回一个细节，就已经很好。</p><form id="memory-form"><label for="memory-input">'+prompts[n.id]+'</label><textarea id="memory-input" placeholder="如果想起来了，就记在这里…" maxlength="1000">'+esc(extraFor(n.id))+'</textarea><button class="primary" type="submit">把这句夹进本页</button></form><div class="status" id="action-status" role="status"></div>'+(extraFor(n.id)?'<div class="journal-memory"><small>后来补写 · 原文另存</small>'+esc(extraFor(n.id))+'</div>':'')+'</aside></section></div>';
}
function renderStudio(){
 app.innerHTML='<div class="studio"><header class="studio-header"><div class="studio-brand">拾景工作台 <span style="color:#b9ca9d">↗</span></div><small>让不同地方的记忆，碰一下面。</small></header><section class="studio-top"><div><div class="eyebrow" style="color:#aaa092;margin-bottom:12px">FRAGMENTS CAN TRAVEL TOGETHER</div><h1 class="serif">这几段旅程，<br>也许有同一条隐线。</h1><p>日期先退到一边。挑选片段，给它们起一个共同的名字。</p></div><div class="studio-tip">试着把码头和陌生小巷<br>收进一束“那些临时拐弯”。<br>联系由你决定。</div></section><div class="studio-work"><section class="fragment-board"><div class="board-label"><span>桌上的片段 / 03</span><span>点击收进，点击撤回</span></div><div class="fragment-grid">'+notes.map(n=>'<article class="fragment '+(state.draftIds.includes(n.id)?'chosen':'')+'"><div class="fragment-date">'+n.date+'</div><h2 class="serif">'+n.place+'</h2><p>'+n.note+'</p><button data-fragment="'+n.id+'">'+(state.draftIds.includes(n.id)?'✓ 已收进线索 · 点此撤回':'+ 收进这束线索')+'</button></article>').join('')+'</div></section><aside><section class="bundle"><div class="eyebrow">MY SMALL COLLECTION</div><h2 class="serif">把它们串起来</h2><label for="bundle-title">这束线索叫什么？</label><input id="bundle-title" placeholder="如：那些临时拐弯" maxlength="40" value="'+esc(state.draftTitle)+'"><div class="bundle-slots">'+(state.draftIds.length?state.draftIds.map(id=>{const n=notes.find(x=>x.id===id);return '<div class="bundle-item"><div>'+n.place+'<small>'+n.date+'</small></div><button data-remove="'+id+'" aria-label="撤回'+n.place+'">×</button></div>'}).join(''):'<div class="bundle-empty">从左边挑两段或更多见闻。<br>可以围绕声音、人、意外，<br>也可以只凭一种感觉。</div>')+'</div><button class="primary" id="save-bundle" '+(!state.draftTitle.trim()||state.draftIds.length<2?'disabled':'')+'>收好这束线索 · '+state.draftIds.length+' 段</button><p class="helper">只建立片段之间的联系，原始日期、地点与见闻仍各自保留。</p><div class="status" id="action-status" role="status"></div></section><section class="saved-bundles"><h3>已经串起来 / '+state.collections.length+'</h3>'+state.collections.map(c=>'<div class="saved-bundle">'+esc(c.title)+'<small>'+c.ids.map(id=>notes.find(n=>n.id===id).place).join(' ↔ ')+'</small></div>').join('')+(state.collections.length?'':'<p class="empty">这张桌子上还没有成束的线索。</p>')+'</section></aside></div></div>';
 document.querySelector('#bundle-title').addEventListener('input',e=>{state.draftTitle=e.target.value;document.querySelector('#save-bundle').disabled=!state.draftTitle.trim()||state.draftIds.length<2;renderState()});
}
function render(){document.body.dataset.variant=variant;if(variant==='A')renderArchive();if(variant==='B')renderJournal();if(variant==='C')renderStudio();renderSwitcher()}
function message(text){const box=document.querySelector('#action-status');if(box)box.textContent=text;renderState()}
document.addEventListener('click',e=>{
 const variantButton=e.target.closest('button[data-variant]');if(variantButton){setVariant(variantButton.dataset.variant);return}
 const selectButton=e.target.closest('button[data-select]');if(selectButton){state.selected=selectButton.dataset.select;render();return}
 const filterButton=e.target.closest('button[data-filter]');if(filterButton){state.filter=filterButton.dataset.filter;render();return}
 const pageButton=e.target.closest('button[data-page]');if(pageButton&&!pageButton.disabled){state.selected=notes[notes.indexOf(selected())+Number(pageButton.dataset.page)].id;render();return}
 const fragment=e.target.closest('button[data-fragment],button[data-remove]');if(fragment){const id=fragment.dataset.fragment||fragment.dataset.remove;state.draftIds=state.draftIds.includes(id)?state.draftIds.filter(x=>x!==id):[...state.draftIds,id];render();return}
 if(e.target.id==='save-bundle'&&!e.target.disabled){state.collections.push({title:state.draftTitle.trim(),ids:[...state.draftIds]});state.draftIds=[];state.draftTitle='';render();message('这一束已收好。本次打开期间可继续看到它。')}
});
document.addEventListener('submit',e=>{
 if(e.target.id==='tag-form'){e.preventDefault();const value=document.querySelector('#tag-input').value.trim();if(!value){message('写一个归类名，再收进抽屉。');return}if(tagsFor(state.selected).includes(value)){message('这段见闻已经放进这个归类了。');return}state.tags[state.selected]=[...tagsFor(state.selected),value];archiveRows();archiveDetail();message('已归类到“'+value+'”。试试用它搜索。')}
 if(e.target.id==='memory-form'){e.preventDefault();const value=document.querySelector('#memory-input').value.trim();if(!value){message('先写下一句你记得的细节。');return}state.additions[state.selected]=value;render();message('这句已经夹进本页，原文保留。')}
});
document.querySelector('#prev-variant').addEventListener('click',()=>cycle(-1));
document.querySelector('#next-variant').addEventListener('click',()=>cycle(1));
document.querySelector('#state-toggle').addEventListener('click',e=>{const panel=document.querySelector('#state-panel');panel.hidden=!panel.hidden;e.target.setAttribute('aria-expanded',String(!panel.hidden));e.target.textContent=panel.hidden?'查看本次状态':'收起本次状态'});
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'){e.preventDefault();cycle(-1)}if(e.key==='ArrowRight'){e.preventDefault();cycle(1)}});
window.addEventListener('popstate',()=>{variant=new URL(location.href).searchParams.get('variant')||'A';if(!names[variant])variant='A';render()});
render();
</script>
</body>
</html>
