<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>静读 · 路线小样</title>
<style>
:root{--ink:#153c59;--muted:#52768d;--sea:#165b87;--canvas:#dceaf3;--paper:#f9fcff;--line:#bdd1df;--focus:#bc6100}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:"Microsoft YaHei","Segoe UI",sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:5px}button:disabled{cursor:default;opacity:.5}a{color:inherit}main{min-height:100vh;display:grid;grid-template-columns:190px minmax(0,1fr);max-width:1440px;margin:auto}.rail{padding:45px 34px;display:flex;flex-direction:column;border-right:1px solid #b2cbdc}.brand{font-size:23px;font-weight:700;letter-spacing:6px}.date{margin-top:84px;font-size:13px;color:var(--muted)}.date strong{display:block;font-family:Georgia,serif;font-size:55px;font-weight:400;color:var(--ink);margin:5px 0}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:34px}.week i{width:12px;height:12px;border:1px solid #92b3c8;border-radius:50%}.week i.today{background:var(--sea);border-color:var(--sea)}.week-title{font-size:11px;color:var(--muted);margin-top:9px}.rail footer{margin-top:auto;padding-top:60px;font-size:12px;line-height:2;color:var(--muted)}.rail footer a{text-decoration:none}.room{position:relative;min-height:100vh;padding:42px clamp(30px,6vw,100px) 35px;display:flex;flex-direction:column}.topline{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}.topline button{border:0;background:none;color:var(--muted);padding:8px}.meter{height:3px;background:#c3d8e5;max-width:180px;width:24%;overflow:hidden}.meter span{display:block;height:100%;width:0;background:var(--sea);transition:width .25s}.reading{max-width:850px;width:100%;margin:auto;position:relative;padding:28px 30px 36px;background:var(--paper);min-height:610px;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 8px 0 #c9dce9,0 30px 65px -50px #316183}.reading:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:#729db8}.question{font-size:14px;color:var(--muted);margin:21px 0 0}.word{font-family:Georgia,"Times New Roman",serif;font-size:clamp(65px,8vw,118px);font-weight:400;line-height:1.05;letter-spacing:-4px;margin:24px 0 5px}.ipa{font-family:Georgia,serif;color:var(--muted);font-size:18px}.landscape{width:280px;height:64px;color:#7ba1ba;margin:28px auto 6px}.answer{height:120px;display:flex;flex-direction:column;justify-content:center;opacity:0;transform:translateY(10px);transition:opacity .25s,transform .25s}.answer.open{opacity:1;transform:none}.answer h2{font-size:23px;letter-spacing:2px;font-weight:500;margin:8px}.example{font-family:Georgia,serif;font-size:18px;margin:8px 0 5px}.translation{font-size:13px;color:var(--muted);margin:0}.actions{margin-top:auto;display:flex;gap:12px;justify-content:center;width:100%;padding-top:25px}.primary,.secondary{min-height:52px;padding:14px 38px;border-radius:4px;border:1px solid var(--sea)}.primary{background:var(--sea);color:white}.secondary{background:transparent;color:var(--sea)}.caption{font-size:12px;color:var(--muted);text-align:center;margin:29px 0 0}.swap{animation:swap .22s ease-out}@keyframes swap{from{opacity:.35;transform:translateX(15px)}to{opacity:1;transform:none}}.seal{border:2px solid var(--sea);border-radius:50%;width:155px;height:155px;display:flex;flex-direction:column;justify-content:center;color:var(--sea);box-shadow:inset 0 0 0 5px var(--paper),inset 0 0 0 6px #82acc5;margin:22px auto;animation:stamp .35s ease-out}.seal strong{font-size:25px;letter-spacing:5px}.seal span{font-size:13px;margin-top:10px}@keyframes stamp{from{transform:scale(1.25);opacity:0}to{transform:scale(1);opacity:1}}.end-title{font-size:35px;font-weight:400;margin:42px 0 8px}.end-copy{color:var(--muted);line-height:1.9}.end-words{display:flex;gap:22px;border-top:1px solid var(--line);padding-top:22px;font-family:Georgia,serif;font-size:22px}.end-words span{display:block;font-family:"Microsoft YaHei",sans-serif;font-size:12px;margin-top:8px;color:var(--muted)}
@media(max-width:700px){main{display:block}.rail{border:0;padding:22px 24px;display:flex;flex-direction:row;justify-content:space-between;align-items:center}.brand{font-size:20px}.date{margin:0;font-size:12px}.date strong{font-size:24px;display:inline;margin:0 5px}.week,.week-title,.rail footer{display:none}.room{padding:10px 18px 25px;min-height:calc(100dvh - 80px)}.topline{margin-bottom:20px}.reading{min-height:555px;padding:20px 16px 26px;margin:0 auto}.question{margin-top:20px}.word{font-size:80px;letter-spacing:-3px;margin-top:28px}.landscape{margin-top:22px}.actions{gap:8px}.primary,.secondary{padding:14px 24px}.caption{margin:23px 0 0}.end-title{font-size:29px;margin-top:26px}.end-words{gap:17px;font-size:20px}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
</style>
<main><aside class="rail"><div class="brand">静读</div><div class="date">十月<strong>15</strong>星期四</div><div><div class="week"><i></i><i></i><i></i><i class="today"></i><i></i><i></i><i></i></div><div class="week-title">本周 · 今天尚未打卡</div></div><footer>每天，给记忆一点时间。<br><a href="index.html">查看其他路线</a></footer></aside><section class="room"><div class="topline"><span id="position">今日 3 词 · 第 1 词</span><div class="meter"><span id="fill"></span></div><button id="reset">重新体验</button></div><article class="reading" id="reading" aria-live="polite"></article><p class="caption">先回忆，再看答案。完成今天的词，打卡就会自然发生。</p></section></main>
<script src="words.js"></script><script>
let queue=[0,1,2],done=new Set(),i=0,revealed=false,retries=new Set();const reading=document.querySelector('#reading');
function draw(){revealed=false;const w=words[queue[i]];document.querySelector('#position').textContent=`今日 3 词 · 已完成 ${done.size} 词`;document.querySelector('#fill').style.width=(done.size/3*100)+'%';reading.classList.remove('swap');void reading.offsetWidth;reading.classList.add('swap');reading.innerHTML=`<p class="question">先想想，它是什么意思？</p><h1 class="word">${w.word}</h1><div class="ipa">${w.ipa} <small> ${w.type}</small></div><svg class="landscape" viewBox="0 0 280 64" fill="none" aria-hidden="true"><path d="M8 49h264M25 57h76m80 0h65M59 46l27-29 27 29M72 32h28m60 15V7m0 0 33 33h-33m-10 7h50l-11 9h-28l-11-9Z" stroke="currentColor" stroke-width="1.4"/><circle cx="223" cy="19" r="10" stroke="currentColor"/></svg><div class="answer"><h2>${w.meaning}</h2><p class="example">${w.example}</p><p class="translation">${w.translation}</p></div><div class="actions"><button class="primary" id="reveal">看看词义</button></div>`;reading.querySelector('#reveal').onclick=()=>{revealed=true;reading.querySelector('.answer').classList.add('open');reading.querySelector('.actions').innerHTML='<button class="secondary" id="again">还想再练</button><button class="primary" id="known">记住了</button>';reading.querySelector('#again').onclick=()=>rate(false);reading.querySelector('#known').onclick=()=>rate(true)};}
function rate(known){if(!revealed)return;revealed=false;const n=queue[i];if(known){done.add(n);retries.delete(n)}else{queue.push(n);retries.add(n)}i++;if(done.size===3){finish();return}draw()}
function finish(){document.querySelector('#position').textContent='今日 3 词 · 已全部完成';document.querySelector('#fill').style.width='100%';document.querySelector('.week-title').textContent='本周 · 今天已打卡';reading.innerHTML='<h1 class="end-title">今天，也记住了一点。</h1><p class="end-copy">三个词，从陌生到熟悉。<br>今日学习已完成，打卡已为你记下。</p><div class="seal"><strong>已打卡</strong><span>10 月 15 日</span></div><div class="end-words">'+words.map(w=>`<div>${w.word}<span>${w.meaning}</span></div>`).join('')+'</div><div class="actions"><button class="secondary" id="once">再看一遍</button></div>';reading.querySelector('#once').onclick=reset;document.querySelector('.caption').textContent='明天再见。今天的努力已经留下。'}
function reset(){queue=[0,1,2];done=new Set();i=0;retries=new Set();document.querySelector('.week-title').textContent='本周 · 今天尚未打卡';document.querySelector('.caption').textContent='先回忆，再看答案。完成今天的词，打卡就会自然发生。';draw()}document.querySelector('#reset').onclick=reset;draw();
</script></html>
