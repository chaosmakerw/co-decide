<script src="words.js"></script><script>
let completed=new Set(),active=null,revealed=false;const panel=document.querySelector('#study');function openNode(n){active=n;revealed=false;const w=words[n];panel.hidden=false;panel.innerHTML=`<button class="close" aria-label="返回地图">×</button><div class="study-head"><small>你来到了${w.place}</small><h2>${w.word}</h2><div class="ipa">${w.ipa} · ${w.type}</div></div><div class="study-content"><p class="prompt">先想想，这个词是什么意思？</p></div><div class="study-actions"><button class="primary" id="reveal">揭示词义</button></div>`;panel.querySelector('.close').onclick=closeNode;panel.querySelector('#reveal').onclick=()=>{revealed=true;panel.querySelector('.study-content').innerHTML=`<h3 class="meaning">${w.meaning}</h3><p class="example">${w.example}</p><p class="translation">${w.translation}</p>`;panel.querySelector('.study-actions').innerHTML='<button class="secondary" id="again">再看一遍</button><button class="primary" id="known">记住，回地图</button>';panel.querySelector('#again').onclick=()=>openNode(n);panel.querySelector('#known').onclick=()=>{if(!revealed)return;completed.add(n);const b=document.querySelector(`[data-node="${n}"]`);b.classList.add('done');b.querySelector('.state').textContent='✓ 已点亮';document.querySelector('#progress').textContent=`已点亮 ${completed.size} / 3 个地点`;document.querySelectorAll('.dots i').forEach((d,i)=>d.classList.toggle('done',i<completed.size));document.querySelector('#path-highlight').innerHTML=completed.size>1?'<path d="M240 365Q320 370 410 280T520 226"/>'+ (completed.size===3?'<path d="M520 226Q570 300 660 370T750 408Q830 390 950 200"/>':''):'';if(completed.size===3){const l=document.querySelector('#lighthouse');l.disabled=false;l.classList.add('ready');l.querySelector('.label').textContent='到灯塔打卡';l.setAttribute('aria-label','到灯塔打卡');document.querySelector('#footer-state').textContent='三个地点已点亮，灯塔在等你。'}closeNode()}};if(innerWidth<641)panel.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth',block:'nearest'})}
function closeNode(){panel.hidden=true;active=null;revealed=false}document.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>openNode(Number(b.dataset.node)));document.querySelector('#lighthouse').onclick=()=>{if(completed.size!==3)return;closeNode();document.querySelector('.mapstage').classList.add('complete');document.querySelector('#lighthouse .label').textContent='10.15 已打卡';document.querySelector('#lighthouse').disabled=true;document.querySelector('#result').classList.add('visible');document.querySelector('#footer-state').textContent='今天已打卡。明天，继续出发。'};document.querySelector('#reset').onclick=()=>{completed.clear();closeNode();document.querySelectorAll('[data-node]').forEach(b=>{b.classList.remove('done');b.querySelector('.state').textContent='去看看'});document.querySelectorAll('.dots i').forEach(d=>d.classList.remove('done'));document.querySelector('#path-highlight').innerHTML='';document.querySelector('#progress').textContent='已点亮 0 / 3 个地点';document.querySelector('.mapstage').classList.remove('complete');document.querySelector('#lighthouse').disabled=true;document.querySelector('#lighthouse').classList.remove('ready');document.querySelector('#lighthouse .label').textContent='终点 · 等你点亮';document.querySelector('#result').classList.remove('visible');document.querySelector('#footer-state').textContent='点亮三个地点后，前往灯塔打卡。'};
