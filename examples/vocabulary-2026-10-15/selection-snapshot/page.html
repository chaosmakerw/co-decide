<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>今日词页 · 路线小样</title>
<style>
:root{--ink:#302844;--soft:#726b80;--line:#d9d4e0;--paper:#fffefd;--canvas:#e6e1ed;--signal:#eceb63;--purple:#5c3885;--stamp:#725098}*{box-sizing:border-box}body{margin:0;background:var(--canvas);font-family:"Microsoft YaHei","Segoe UI",sans-serif;color:var(--ink);padding:30px 38px}button,a{-webkit-tap-highlight-color:transparent}button{cursor:pointer;font:inherit}button:focus-visible,a:focus-visible{outline:3px solid var(--purple);outline-offset:4px}button:disabled{cursor:default}a{color:inherit}.top{max-width:1300px;margin:0 auto 24px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:700}.top a{font-size:12px;text-decoration:none}.sheet{max-width:1300px;margin:auto;display:grid;grid-template-columns:45px minmax(0,1fr) 268px;min-height:740px;background:var(--paper);box-shadow:10px 13px 0 #cfc6dc}.binding{border-right:1px solid var(--line);display:flex;align-items:center;flex-direction:column;gap:110px;padding-top:80px}.hole{border-radius:50%;width:12px;height:12px;background:var(--canvas);box-shadow:inset 1px 2px 2px #bfb5cd}.work{padding:40px 45px 28px}.head{display:flex;align-items:flex-start;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:28px}.head h1{font-size:44px;letter-spacing:-1px;font-weight:500;margin:0 0 13px}.head p{font-size:13px;color:var(--soft);line-height:1.8;margin:0}.page-tab{background:var(--signal);font-size:13px;padding:10px 13px;transform:rotate(3deg);white-space:nowrap}.columns{display:flex;justify-content:space-between;color:var(--soft);font-size:11px;padding:17px 0 13px;border-bottom:1px solid var(--line)}.entry{border-bottom:1px solid var(--line);padding:22px 0}.entry-head{display:grid;grid-template-columns:45px minmax(0,1fr) auto;align-items:center;gap:8px}.num{font-family:Georgia,serif;font-size:14px;color:#8f879c}.word-btn{border:0;padding:0;background:none;text-align:left;color:var(--ink)}.word-btn strong{font-family:Georgia,serif;font-size:37px;font-weight:400}.word-btn small{font-size:12px;color:var(--soft);margin-left:15px}.open-btn{border:0;background:none;font-size:12px;color:var(--purple);padding:12px 0 12px 12px}.detail{margin:16px 0 0 53px;animation:unfold .22s ease-out;display:none}.entry.open .detail{display:block}.meaning{font-size:20px;display:flex;align-items:center;gap:15px;margin:8px 0 12px}.meaning small{font-size:12px;font-weight:400;color:var(--soft)}.example{font-family:Georgia,serif;font-size:18px;margin:0 0 6px}.translation{font-size:12px;color:var(--soft);margin:0 0 19px}.rates{display:flex;gap:9px}.rate{font-size:12px;border:1px solid #aca1bb;background:white;padding:9px 15px;color:var(--ink);border-radius:2px}.rate.chosen{background:var(--purple);color:white;border-color:var(--purple)}.entry.done .num{font-family:inherit;font-size:18px;color:var(--purple)}.entry.done .word-btn strong{text-decoration-color:var(--signal);text-decoration-thickness:7px;text-decoration-line:underline;text-underline-offset:0px;text-decoration-skip-ink:none}.entry-status{font-size:11px;color:var(--purple);margin-left:7px}.footnote{font-size:12px;color:var(--soft);line-height:1.8;margin-top:24px}.ticket{border-left:2px dashed var(--line);position:relative;padding:35px 27px;display:flex;flex-direction:column;align-items:center}.ticket:before,.ticket:after{content:"";position:absolute;left:-11px;width:20px;height:10px;background:var(--canvas);border-radius:0 0 20px 20px;top:0}.ticket:after{top:auto;bottom:0;transform:rotate(180deg)}.ticket-title{font-size:13px;letter-spacing:3px}.month{margin-top:34px;font-size:14px}.day{font-family:Georgia,serif;font-size:102px;line-height:1;margin-top:3px}.weekday{font-size:12px;color:var(--soft);margin:12px 0 30px}.stamp-box{width:174px;height:174px;border:1px dashed #b5a6c6;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#8e7e9e;position:relative}.stamp-box>span{font-size:12px}.stamp-mark{border:4px double var(--stamp);width:143px;height:143px;border-radius:7px;display:flex;flex-direction:column;justify-content:center;align-items:center;transform:rotate(-10deg);color:var(--stamp);animation:stamp .32s ease-out}.stamp-mark strong{font-size:27px;letter-spacing:5px;border-bottom:1px solid var(--stamp);padding-bottom:12px}.stamp-mark small{font-size:11px;margin-top:12px}.ticket-progress{font-size:12px;margin:28px 0 14px}.stamp-btn{padding:13px 16px;background:var(--purple);border:1px solid var(--purple);color:white;border-radius:3px;width:100%;font-size:14px}.stamp-btn:disabled{background:#e8e3ed;color:#9b90a8;border-color:#e8e3ed}.ticket-copy{font-size:11px;color:var(--soft);line-height:1.8;text-align:center}.reset{margin-top:auto;font-size:11px;border:0;background:none;color:var(--soft);padding:20px 10px 0}@keyframes unfold{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}@keyframes stamp{from{opacity:0;transform:scale(1.4) rotate(-10deg)}to{opacity:1;transform:scale(1) rotate(-10deg)}}
@media(max-width:900px){body{padding:24px 22px}.sheet{grid-template-columns:30px minmax(0,1fr) 205px}.work{padding:32px 25px}.ticket{padding:32px 18px}.head h1{font-size:35px}.word-btn small{display:none}.stamp-box{width:155px;height:155px}.stamp-mark{width:130px;height:130px}.page-tab{font-size:11px}.entry-head{grid-template-columns:32px minmax(0,1fr) auto}.detail{margin-left:40px}}@media(max-width:640px){body{padding:20px 12px}.top{margin-bottom:18px;padding:0 8px}.sheet{grid-template-columns:22px minmax(0,1fr);box-shadow:4px 6px 0 #cfc6dc}.binding{gap:150px;padding-top:90px}.hole{width:8px;height:8px}.work{padding:25px 20px}.head{padding-bottom:22px}.head h1{font-size:32px}.head p{font-size:12px}.page-tab{padding:8px;writing-mode:vertical-rl;transform:none}.columns{font-size:10px}.entry{padding:20px 0}.entry-head{grid-template-columns:24px minmax(0,1fr) auto;gap:3px}.word-btn strong{font-size:31px}.open-btn{font-size:11px;padding-left:6px}.detail{margin-left:27px}.meaning{font-size:18px}.example{font-size:17px;line-height:1.5}.rates{gap:6px}.rate{padding:9px 10px;font-size:11px}.ticket{grid-column:2;border-left:0;border-top:2px dashed var(--line);display:grid;grid-template-columns:1fr 1fr;gap:0 16px;align-items:center;padding:25px 20px}.ticket:before,.ticket:after{display:none}.ticket-title{grid-column:1/-1;margin-bottom:16px;font-size:12px}.month{margin:0}.day{font-size:74px;grid-column:1}.weekday{margin:0;grid-column:1}.stamp-box{grid-column:2;grid-row:2/5;width:130px;height:130px}.stamp-mark{width:115px;height:115px}.stamp-mark strong{font-size:23px}.ticket-progress{grid-column:1/-1;margin:22px 0 12px}.stamp-btn,.ticket-copy,.reset{grid-column:1/-1}.reset{padding-top:10px}.footnote{margin-bottom:0}.stamp-box>span{font-size:11px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<header class="top"><div class="brand">今日词页</div><a href="index.html">查看其他路线</a></header><main class="sheet"><aside class="binding" aria-hidden="true"><i class="hole"></i><i class="hole"></i><i class="hole"></i><i class="hole"></i></aside><section class="work"><header class="head"><div><h1>把今天，记在这一页。</h1><p>三个词，一页日课。<br>任选一个开始，核对后留下自己的判断。</p></div><div class="page-tab">今日 3 词</div></header><div class="columns"><span>单词与回忆</span><span>展开词义后自评</span></div><div id="entries"></div><p class="footnote">不必按顺序。完成每个词的自评后，<br>到右边为今天盖一枚章。</p></section><aside class="ticket"><div class="ticket-title">今日学习凭证</div><div class="month">2026 年 10 月</div><div class="day">15</div><div class="weekday">星期四</div><div class="stamp-box" id="stamp"><span>等你完成今天这一页</span></div><div class="ticket-progress" aria-live="polite">已完成 <strong id="count">0</strong> / 3 词</div><button class="stamp-btn" id="check" disabled>完成词页后盖章</button><p class="ticket-copy">学习由你推进，<br>这枚章也由你亲手留下。</p><button class="reset" id="reset">重新体验这一页</button></aside></main>
<script src="words.js"></script><script>
let ratings={};const entries=document.querySelector('#entries');function draw(){entries.innerHTML=words.map((w,i)=>`<article class="entry" data-i="${i}"><div class="entry-head"><span class="num">${i+1}</span><button class="word-btn" aria-expanded="false"><strong>${w.word}</strong><small>${w.ipa}</small></button><button class="open-btn">展开词义 ＋</button></div><div class="detail"><h2 class="meaning">${w.meaning}<small>${w.type}</small></h2><p class="example">${w.example}</p><p class="translation">${w.translation}</p><div class="rates"><button class="rate" data-rate="again">还想再练</button><button class="rate" data-rate="known">记住了</button><span class="entry-status"></span></div></div></article>`).join('');entries.querySelectorAll('.entry').forEach(entry=>{const toggle=()=>{const open=entry.classList.toggle('open');entry.querySelector('.word-btn').setAttribute('aria-expanded',open);entry.querySelector('.open-btn').textContent=open?'收起 −':'展开词义 ＋'};entry.querySelector('.word-btn').onclick=toggle;entry.querySelector('.open-btn').onclick=toggle;entry.querySelectorAll('.rate').forEach(button=>button.onclick=()=>{ratings[entry.dataset.i]=button.dataset.rate;entry.classList.add('done');entry.querySelector('.num').textContent='✓';entry.querySelectorAll('.rate').forEach(b=>{b.classList.toggle('chosen',b===button);b.setAttribute('aria-pressed',b===button)});entry.querySelector('.entry-status').textContent=button.dataset.rate==='again'?'留待复习':'已记下';const count=Object.keys(ratings).length;document.querySelector('#count').textContent=count;if(count===3){document.querySelector('#check').disabled=false;document.querySelector('#check').textContent='为今天盖章';document.querySelector('#stamp').innerHTML='<span>今天这一页，完成了。</span>'}})});}
document.querySelector('#check').onclick=()=>{if(Object.keys(ratings).length!==3)return;document.querySelector('#stamp').innerHTML='<div class="stamp-mark"><strong>已打卡</strong><small>今日词页 · 10 月 15 日</small></div>';document.querySelector('#check').disabled=true;document.querySelector('#check').textContent='今日打卡已留下';document.querySelector('.ticket-copy').innerHTML='三个词，一页完成。<br>明天，再翻新的一页。'};document.querySelector('#reset').onclick=()=>{ratings={};document.querySelector('#count').textContent='0';document.querySelector('#stamp').innerHTML='<span>等你完成今天这一页</span>';document.querySelector('#check').disabled=true;document.querySelector('#check').textContent='完成词页后盖章';document.querySelector('.ticket-copy').innerHTML='学习由你推进，<br>这枚章也由你亲手留下。';draw()};draw();
</script></html>
